name: LOM Operational Maturity Evidence Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-5-operational-maturity/**'
      - '.github/workflows/lom-operational-maturity-evidence.yml'
      - '.github/workflows/lom-master-compliance.yml'
  push:
    branches: [main]
    paths:
      - 'vl/lom-5-operational-maturity/**'
      - '.github/workflows/lom-operational-maturity-evidence.yml'
      - '.github/workflows/lom-master-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-maturity-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Operational maturity regression
        working-directory: vl/lom-5-operational-maturity
        run: python -m unittest -v test_runtime.py test_multi_project_evidence.py test_evidence_capture.py
      - name: Build longitudinal evidence summary without asserting false completion
        working-directory: vl/lom-5-operational-maturity
        run: python build_longitudinal_summary.py --output /tmp/lom-operational-maturity-summary.json
      - name: Verify authority remains locked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/lom-operational-maturity-summary.json').read_text())
          assert summary['status'] in {'PASS', 'HOLD'}
          assert summary['production_locked'] is True
          assert summary['autonomous_ceiling'] == 'PREPARE_PR'
          print('Evidence integrity:', summary['status'], summary['reason'])
          PY
