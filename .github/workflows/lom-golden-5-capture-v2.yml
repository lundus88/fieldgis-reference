name: LOM Golden 5 Capture v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/**'
      - '.github/workflows/lom-golden-5-capture-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-5:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute measured Golden 5 run
        env:
          GOLDEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/run.py
      - name: Independent validation
        run: python vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/validate.py
      - name: Enforce pre-human evidence HOLD
        run: python vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/finalize_pre_human.py
      - name: Hash evidence package
        run: |
          cd vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2
          sha256sum execution-result.json independent-validation.json pre-human-evidence-record.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload immutable run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lom-golden-5-capture-v2-${{ github.sha }}
          path: |
            vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/execution-result.json
            vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/independent-validation.json
            vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/pre-human-evidence-record.json
            vl/lom-5-operational-maturity/golden-runs/golden-5-lom-capture-v2/SHA256SUMS.txt
          retention-days: 7
