name: VL Agent Control Plane Admin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: ACP operation
        required: true
        type: choice
        options:
          - delegate_grant
          - revoke_grant
      action_id:
        description: Stable idempotency key (16-160 chars)
        required: true
        type: string
      parent_grant_id:
        description: Parent grant UUID (delegate only)
        required: false
        type: string
      agent_id:
        description: Agent ID (delegate only)
        required: false
        type: string
      agent_version:
        description: Agent version (delegate only)
        required: false
        type: string
      role_name:
        description: Agent role (delegate only)
        required: false
        type: string
      capabilities_json:
        description: JSON array of non-production capabilities (delegate only)
        required: false
        default: '[]'
        type: string
      project_id:
        description: Scoped project ID (delegate only)
        required: false
        type: string
      target_environment:
        description: Non-production target (delegate only)
        required: false
        type: choice
        options:
          - staging
          - development
      timeout_seconds:
        description: Timeout budget (delegate only)
        required: false
        default: '300'
        type: string
      max_retries:
        description: Retry budget (delegate only)
        required: false
        default: '0'
        type: string
      valid_from:
        description: RFC3339 activation time (delegate only)
        required: false
        type: string
      valid_until:
        description: RFC3339 expiry time (delegate only)
        required: false
        type: string
      grant_id:
        description: Agent grant UUID (revoke only)
        required: false
        type: string
      reason:
        description: Revocation reason, 8-500 chars (revoke only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: vl-agent-control-plane-admin
  cancel-in-progress: false

jobs:
  acp-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACP_EDGE_URL: https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-agent-control-oidc
    steps:
      - name: Validate bounded request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          ACTION_ID: ${{ inputs.action_id }}
          PARENT_GRANT_ID: ${{ inputs.parent_grant_id }}
          AGENT_ID: ${{ inputs.agent_id }}
          AGENT_VERSION: ${{ inputs.agent_version }}
          ROLE_NAME: ${{ inputs.role_name }}
          CAPABILITIES_JSON: ${{ inputs.capabilities_json }}
          PROJECT_ID: ${{ inputs.project_id }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          MAX_RETRIES: ${{ inputs.max_retries }}
          VALID_FROM: ${{ inputs.valid_from }}
          VALID_UNTIL: ${{ inputs.valid_until }}
          GRANT_ID: ${{ inputs.grant_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime

          UUID_RE=re.compile(r'^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')
          ACTION_RE=re.compile(r'^[A-Za-z0-9._:-]{16,160}$')

          def bounded_text(name, min_len=1, max_len=200):
              value=os.environ.get(name,'').strip()
              if not (min_len <= len(value) <= max_len):
                  raise SystemExit(f'invalid {name.lower()}')
              return value

          def bounded_int(name, minimum, maximum):
              raw=os.environ.get(name,'').strip()
              if not re.fullmatch(r'[0-9]+', raw):
                  raise SystemExit(f'invalid {name.lower()}')
              value=int(raw)
              if value < minimum or value > maximum:
                  raise SystemExit(f'{name.lower()} out of bounds')
              return value

          def parse_time(name):
              value=bounded_text(name, 10, 64)
              try:
                  return datetime.fromisoformat(value.replace('Z','+00:00')), value
              except ValueError:
                  raise SystemExit(f'invalid {name.lower()}')

          op=os.environ['OPERATION']
          action_id=os.environ['ACTION_ID'].strip()
          if not ACTION_RE.fullmatch(action_id):
              raise SystemExit('invalid action_id')

          if op == 'delegate_grant':
              parent=bounded_text('PARENT_GRANT_ID',36,36)
              if not UUID_RE.fullmatch(parent):
                  raise SystemExit('invalid parent_grant_id')
              agent_id=bounded_text('AGENT_ID',1,128)
              agent_version=bounded_text('AGENT_VERSION',1,64)
              role_name=bounded_text('ROLE_NAME',1,128)
              project_id=bounded_text('PROJECT_ID',1,128)
              target=os.environ.get('TARGET_ENVIRONMENT','').strip()
              if target not in ('development','staging'):
                  raise SystemExit('production target prohibited')
              caps=json.loads(os.environ.get('CAPABILITIES_JSON') or '[]')
              if not isinstance(caps,list) or not caps or len(caps)>32 or not all(isinstance(x,str) and 1 <= len(x.strip()) <= 200 for x in caps):
                  raise SystemExit('invalid capabilities_json')
              caps=sorted(set(x.strip() for x in caps))
              if any(x in ('production.approve','production.promote') for x in caps):
                  raise SystemExit('production capability prohibited')
              timeout=bounded_int('TIMEOUT_SECONDS',1,3600)
              retries=bounded_int('MAX_RETRIES',0,10)
              valid_from_dt, valid_from=parse_time('VALID_FROM')
              valid_until_dt, valid_until=parse_time('VALID_UNTIL')
              if valid_until_dt <= valid_from_dt:
                  raise SystemExit('invalid validity window')
              payload={
                  'operation':'delegate_grant','action_id':action_id,'parent_grant_id':parent,
                  'agent_id':agent_id,'agent_version':agent_version,'role_name':role_name,
                  'capabilities':caps,
                  'scope':{'project_id':project_id,'target_environment':target},
                  'budget':{'timeout_seconds':timeout,'max_retries':retries},
                  'valid_from':valid_from,'valid_until':valid_until,
              }
          elif op == 'revoke_grant':
              grant_id=bounded_text('GRANT_ID',36,36)
              if not UUID_RE.fullmatch(grant_id):
                  raise SystemExit('invalid grant_id')
              reason=bounded_text('REASON',8,500)
              payload={'operation':'revoke_grant','action_id':action_id,'grant_id':grant_id,'reason':reason}
          else:
              raise SystemExit('unsupported operation')

          Path('/tmp/acp-payload.json').write_text(json.dumps(payload,separators=(',',':')))
          print('validated bounded ACP admin payload')
          PY

      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-agent-control-plane")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$token"

      - name: Invoke ACP boundary
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST "$ACP_EDGE_URL" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $OIDC_TOKEN" \
            --data-binary @/tmp/acp-payload.json)"
          cat "$body"
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "ACP boundary rejected request with HTTP $code" >&2
            exit 1
          fi
          python3 - "$body" <<'PY'
          import json, sys
          payload=json.load(open(sys.argv[1]))
          assert payload.get('ok') is True
          assert payload.get('operation') in ('delegate_grant','revoke_grant')
          PY
