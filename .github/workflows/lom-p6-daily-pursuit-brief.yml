name: LOM P6 Daily Pursuit Brief

on:
  pull_request:
    paths:
      - 'vl/lom-daily-pursuit-brief/**'
      - '.github/workflows/lom-p6-daily-pursuit-brief.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run daily pursuit brief tests
        run: python -m unittest vl/lom-daily-pursuit-brief/test_brief.py
