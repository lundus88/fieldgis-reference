name: LUNDUS DIGITAL SYSTEMS Customer Onboarding Kickoff
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-customer-onboarding-kickoff/**'
      - '.github/workflows/lds-customer-onboarding-kickoff.yml'
permissions:
  contents: read
jobs:
  kickoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-customer-onboarding-kickoff/check_kickoff.py
      - working-directory: docs/commercial/lds-customer-onboarding-kickoff
        run: python3 -m unittest -v test_kickoff_readiness.py
