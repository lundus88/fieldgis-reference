name: LOM P4 Director Loop

on:
  push:
    branches:
      - lom-p4-autonomous-director-loop
  pull_request:
    paths:
      - 'vl/lom-director-loop/**'
      - 'vl/lom-portfolio-runtime/**'
      - '.github/workflows/lom-p4-director-loop.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run director loop tests
        run: python -m pytest -q vl/lom-director-loop/test_director_loop.py
      - name: Generate director brief
        run: python vl/lom-director-loop/director_loop.py
