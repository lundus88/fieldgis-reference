name: VL Baseline Materialize Plaintext

on:
  push:
    branches:
      - fix/vl-migration-reproducibility-refresh-20261004
    paths:
      - .github/workflows/vl-baseline-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Verify and materialize reviewed schema baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="vl/migrations/baselines/2026-10-04"
          test -f "$BASE/remote_schema.sql.gz"
          gunzip -c "$BASE/remote_schema.sql.gz" > "$BASE/remote_schema.sql"
          test "$(sha256sum "$BASE/remote_schema.sql" | awk '{print $1}')" = "50d426da6ad13641d5ef3d44b0a3fa84ea61828e4c549d4fef6faa5ef812afb5"
          if grep -Eqi '(sb_secret_[A-Za-z0-9_-]+|sk[_-][A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|password[[:space:]]*=[[:space:]]*[^[:space:];]{8,})' "$BASE/remote_schema.sql"; then
            echo 'Potential credential material detected; refusing to commit plaintext baseline.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE/remote_schema.sql"
          git commit -m "chore(vl): materialize reviewed schema baseline SQL"
          git push origin "HEAD:${GITHUB_REF_NAME}"
