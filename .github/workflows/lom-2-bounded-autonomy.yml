name: LOM 2.0 Bounded Autonomy

on:
  pull_request:
    paths:
      - 'vl/lom-4-evolution/**'
      - '.github/workflows/lom-2-bounded-autonomy.yml'
  push:
    branches:
      - lom-2-bounded-autonomy-loop

jobs:
  bounded-autonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run LOM 2.0 bounded autonomy tests
        working-directory: vl/lom-4-evolution
        run: python -m unittest -v test_lom2_bounded_loop.py test_foundation.py
      - name: Validate foundation invariants
        working-directory: vl/lom-4-evolution
        run: python validate_foundation.py
