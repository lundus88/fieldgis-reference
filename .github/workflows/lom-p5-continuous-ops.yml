name: LOM P5 Continuous Operations

on:
  push:
    branches:
      - lom-p5-continuous-operations
  pull_request:
    paths:
      - 'vl/lom-continuous-ops/**'
      - '.github/workflows/lom-p5-continuous-ops.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate continuous operations policy
        run: python vl/lom-continuous-ops/validate_policy.py
