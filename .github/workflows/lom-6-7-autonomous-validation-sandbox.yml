name: LOM 6.7 Autonomous Validation Sandbox

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-6-7-autonomous-validation-sandbox/**'
      - '.github/workflows/lom-6-7-autonomous-validation-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run LOM 6.7 regression suite
        working-directory: vl/lom-6-7-autonomous-validation-sandbox
        run: python -m unittest -v test_sandbox.py
