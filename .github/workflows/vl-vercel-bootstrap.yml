name: VL Vercel Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-vercel-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_tV4WIIVgvU5VybM7PIhiuVNO
    steps:
      - name: Verify credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING'; exit 1; }

      - name: Ensure dedicated VL projects exist
        shell: bash
        run: |
          set -euo pipefail
          for NAME in vl-pwa-production vl-gis-production; do
            STATUS=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${NAME}?teamId=${VERCEL_TEAM_ID}")
            if [ "$STATUS" = "200" ]; then
              echo "$NAME already exists"
            elif [ "$STATUS" = "404" ]; then
              curl -fsS -X POST \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H 'Content-Type: application/json' \
                "https://api.vercel.com/v11/projects?teamId=${VERCEL_TEAM_ID}" \
                -d "{\"name\":\"${NAME}\"}" > "/tmp/${NAME}.json"
              python3 -c "import json,sys; n=sys.argv[1]; d=json.load(open('/tmp/'+n+'.json')); assert str(d.get('id','')).startswith('prj_'), d; assert d.get('name')==n, d; print('CREATED',n,d['id'])" "$NAME"
            else
              echo "Unexpected Vercel status $STATUS for $NAME"
              cat /tmp/project.json || true
              exit 1
            fi
          done

      - name: Verify project inventory
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects?teamId=${VERCEL_TEAM_ID}&limit=50" > /tmp/projects.json
          python3 -c "import json; p=json.load(open('/tmp/projects.json')).get('projects',[]); by={x.get('name'):x.get('id') for x in p}; [(_ for _ in ()).throw(AssertionError((n,by.get(n)))) if not (by.get(n) and str(by.get(n)).startswith('prj_')) else print('VERIFIED',n,by[n]) for n in ('vl-pwa-production','vl-gis-production')]"
