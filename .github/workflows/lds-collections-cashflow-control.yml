name: LUNDUS DIGITAL SYSTEMS Collections Cashflow Control
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-collections-cashflow-control/**'
      - '.github/workflows/lds-collections-cashflow-control.yml'
permissions:
  contents: read
jobs:
  collections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-collections-cashflow-control/check_collections_cashflow.py
      - working-directory: docs/commercial/lds-collections-cashflow-control
        run: python3 -m unittest -v test_collections_cashflow.py
