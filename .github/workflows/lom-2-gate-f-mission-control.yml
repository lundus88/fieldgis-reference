name: LOM 2.0 Gate F Mission Control

on:
  pull_request:
    paths:
      - 'vl/lom-mission-control/**'
      - '.github/workflows/lom-2-gate-f-mission-control.yml'
  push:
    branches:
      - lom-2-gate-f-mission-control
      - lom-mission-control-v2
    paths:
      - 'vl/lom-mission-control/**'
      - '.github/workflows/lom-2-gate-f-mission-control.yml'

permissions:
  contents: read

jobs:
  mission-control-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run Mission Control regression tests
        working-directory: vl/lom-mission-control
        run: python -m unittest discover -s . -p 'test*.py' -v
      - name: Assert Mission Control authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('vl/lom-mission-control/mission_control.py').read_text()
          for marker in (
              '"production_authority": "HUMAN_ONLY"',
              '"protected_main_merge": "HUMAN_ONLY"',
              '"control_execution": "DISABLED"',
              '"autonomous_ceiling": "PREPARE_PR"',
              '"execution_performed": False',
          ):
              assert marker in text, marker
          print('MISSION CONTROL AUTHORITY BOUNDARY: PASS')
          PY
