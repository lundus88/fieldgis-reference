name: LOM 2.0 Gate F Mission Control

on:
  pull_request:
    paths:
      - 'vl/lom-mission-control/**'
      - '.github/workflows/lom-2-gate-f-mission-control.yml'
  push:
    branches:
      - lom-2-gate-f-mission-control
    paths:
      - 'vl/lom-mission-control/**'
      - '.github/workflows/lom-2-gate-f-mission-control.yml'

jobs:
  mission-control-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Mission Control regression tests
        working-directory: vl/lom-mission-control
        run: python -m unittest -q
