name: VL Visual Preview Browser Evidence

on:
  push:
    branches: [vl/issue-130-visual-preview-evidence]
    paths:
      - 'vl/visual-preview/**'
      - '.github/workflows/vl-visual-preview-browser-evidence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vl/visual-preview/**'
      - '.github/workflows/vl-visual-preview-browser-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install independent browser verifier
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build representative immutable factory artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vl-preview-artifact /tmp/vl-preview-extracted
          mkdir -p /tmp/vl-preview-artifact/dist /tmp/vl-preview-extracted
          cp -a vl/visual-preview/sample/. /tmp/vl-preview-artifact/dist/
          tar -C /tmp/vl-preview-artifact -czf /tmp/vl-web-build.tgz dist
          sha256sum /tmp/vl-web-build.tgz | awk '{print $1}' > /tmp/artifact.sha256
          cat > /tmp/app-spec.json <<'JSON'
          {"schema":"vl.app-spec/preview-proof-1","title":"VL Visual Preview Pilot","builder_key":"web-react-v1","production_locked":true}
          JSON
          sha256sum /tmp/app-spec.json | awk '{print $1}' > /tmp/app-spec.sha256
          tar -xzf /tmp/vl-web-build.tgz -C /tmp/vl-preview-extracted
          test -s /tmp/vl-preview-extracted/dist/index.html

      - name: Start extracted artifact sandbox preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/vl-preview-extracted/dist > /tmp/vl-preview.log 2>&1 &
          echo $! > /tmp/vl-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vl-preview.log
          exit 1

      - name: Run generalized independent browser verification
        env:
          VL_PREVIEW_URL: http://127.0.0.1:4173
          VL_PREVIEW_OUT: vl/visual-preview/evidence-factory
          VL_SOURCE_SHA: ${{ github.sha }}
          VL_BUILDER_KEY: web-react-v1
          VL_ACCEPTANCE_INVENTORY: vl/visual-preview/acceptance-inventory.sample.json
        shell: bash
        run: |
          set -euo pipefail
          export VL_ARTIFACT_SHA256="$(cat /tmp/artifact.sha256)"
          export VL_APP_SPEC_SHA256="$(cat /tmp/app-spec.sha256)"
          node vl/visual-preview/verify-factory-preview.mjs

      - name: Validate immutable factory-bound evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s vl/visual-preview/evidence-factory/evidence.json
          test -s vl/visual-preview/evidence-factory/preview-desktop.png
          test -s vl/visual-preview/evidence-factory/preview-mobile.png
          python3 - <<'PY'
          import json,re
          p='vl/visual-preview/evidence-factory/evidence.json'
          d=json.load(open(p))
          assert d['schema']=='vl.visual-preview-evidence/2'
          assert d['verifier']=='independent-playwright'
          assert d['builder_key']=='web-react-v1'
          assert d['environment']=='DEV_SANDBOX_ONLY'
          assert d['production_authority'] is False
          assert re.fullmatch(r'[0-9a-f]{64}', d['artifact_sha256'])
          assert re.fullmatch(r'[0-9a-f]{64}', d['app_spec_sha256'])
          assert d['source_sha']
          assert d['conclusion']=='PASS'
          assert d['checks']['console_errors']==[]
          assert d['checks']['network_failures']==[]
          print('VL FACTORY-BOUND VISUAL EVIDENCE CONTRACT: PASS')
          PY

      - name: Upload generalized visual verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl-visual-preview-factory-bound-evidence
          path: vl/visual-preview/evidence-factory/
          if-no-files-found: error
          retention-days: 90
