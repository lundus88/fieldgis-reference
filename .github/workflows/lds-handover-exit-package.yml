name: LUNDUS DIGITAL SYSTEMS Handover Exit Package
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-handover-exit-package/**'
      - '.github/workflows/lds-handover-exit-package.yml'
permissions:
  contents: read
jobs:
  handover-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-handover-exit-package/check_handover_exit.py
      - working-directory: docs/commercial/lds-handover-exit-package
        run: python3 -m unittest -v test_handover_exit.py
