name: VL Provenance SBOM Harness

on:
  workflow_dispatch:
  push:
    branches:
      - vl/provenance-sbom-20260829
    paths:
      - .github/workflows/vl-provenance-sbom-harness.yml

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  provenance-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build deterministic sample artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf provenance-sample
          mkdir -p provenance-sample
          printf 'VL provenance harness\ncommit=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW" > provenance-sample/BUILD-INFO.txt
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -czf vl-provenance-sample.tgz provenance-sample
          sha256sum vl-provenance-sample.tgz | tee artifact.sha256

      - name: Generate SPDX 2.3 SBOM bound to artifact SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,uuid
          path='vl-provenance-sample.tgz'
          digest=hashlib.sha256(open(path,'rb').read()).hexdigest()
          doc={
            'spdxVersion':'SPDX-2.3',
            'dataLicense':'CC0-1.0',
            'SPDXID':'SPDXRef-DOCUMENT',
            'name':'VL Provenance Harness SBOM',
            'documentNamespace':f'https://github.com/lundus88/fieldgis-reference/spdx/{uuid.uuid4()}',
            'creationInfo':{
              'created':'2026-08-29T00:00:00Z',
              'creators':['Tool: VL-Provenance-Harness']
            },
            'packages':[{
              'name':'vl-provenance-sample',
              'SPDXID':'SPDXRef-Package-vl-provenance-sample',
              'versionInfo':os.environ.get('GITHUB_SHA','unknown'),
              'downloadLocation':'NOASSERTION',
              'filesAnalyzed':False,
              'checksums':[{'algorithm':'SHA256','checksumValue':digest}],
              'licenseConcluded':'NOASSERTION',
              'licenseDeclared':'NOASSERTION',
              'copyrightText':'NOASSERTION'
            }],
            'relationships':[{
              'spdxElementId':'SPDXRef-DOCUMENT',
              'relationshipType':'DESCRIBES',
              'relatedSpdxElement':'SPDXRef-Package-vl-provenance-sample'
            }]
          }
          json.dump(doc,open('sbom.spdx.json','w'),indent=2)
          print('artifact_sha256='+digest)
          PY

      - name: Generate signed build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: vl-provenance-sample.tgz

      - name: Generate signed SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: vl-provenance-sample.tgz
          sbom-path: sbom.spdx.json

      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify vl-provenance-sample.tgz -R lundus88/fieldgis-reference --format json > provenance-verify.json
          python3 - <<'PY'
          import json
          d=json.load(open('provenance-verify.json'))
          assert d, 'no build provenance attestation returned'
          print('BUILD_PROVENANCE_VERIFY=PASS')
          PY

      - name: Verify signed SPDX SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify vl-provenance-sample.tgz -R lundus88/fieldgis-reference --predicate-type https://spdx.dev/Document/v2.3 --format json > sbom-verify.json
          python3 - <<'PY'
          import json
          d=json.load(open('sbom-verify.json'))
          assert d, 'no SPDX SBOM attestation returned'
          pred=d[0]['verificationResult']['statement']['predicate']
          assert pred.get('spdxVersion')=='SPDX-2.3', pred
          print('SBOM_ATTESTATION_VERIFY=PASS')
          PY

      - name: Verify artifact and SBOM digest binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          actual=hashlib.sha256(open('vl-provenance-sample.tgz','rb').read()).hexdigest()
          sbom=json.load(open('sbom.spdx.json'))
          declared=sbom['packages'][0]['checksums'][0]['checksumValue']
          assert actual==declared, (actual,declared)
          print('ARTIFACT_SBOM_SHA_BINDING=PASS')
          PY

      - name: Upload provenance evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: vl-provenance-sbom-evidence-${{ github.run_id }}
          path: |
            vl-provenance-sample.tgz
            artifact.sha256
            sbom.spdx.json
            provenance-verify.json
            sbom-verify.json
          if-no-files-found: error
          retention-days: 30

      - name: Scope guard
        run: |
          echo 'P1 HARNESS ONLY: cryptographic GitHub artifact attestations + SPDX SBOM verification.'
          echo 'No production deployment, no production promotion, no payment, no customer data.'
