name: VL Promoter Patch Smoke JWT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-promoter-patch-smoke-jwt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch promoter to derive smoke JWT from Management API
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('.github/workflows/vl-production-promoter.yml')
          s = p.read_text()

          # Remove the repository-secret smoke JWT env lines from both Supabase steps.
          s, removed_env = re.subn(
              r'^\s{10}SUPABASE_FUNCTION_SMOKE_JWT:.*\n',
              '',
              s,
              flags=re.M,
          )

          # Remove the explicit requirement for a second repository secret.
          s, removed_check = re.subn(
              r'^\s{10}test -n "\$\{SUPABASE_FUNCTION_SMOKE_JWT:-\}".*\n',
              '',
              s,
              flags=re.M,
          )

          marker = '          # Verify provider metadata and JWT enforcement first.\n'
          dynamic = '''          # Fetch a low-privilege legacy anon JWT only for authenticated smoke verification.\n          curl -fsS \\\n            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \\\n            "https://api.supabase.com/v1/projects/${SUPABASE_PROD_PROJECT_REF}/api-keys?reveal=true" \\\n            -o /tmp/api-keys.json\n          SUPABASE_FUNCTION_SMOKE_JWT=$(python3 - <<'PY'\nimport json\nd=json.load(open('/tmp/api-keys.json'))\nitems=d if isinstance(d,list) else d.get('keys',[])\nfor x in items:\n    name=str(x.get('name') or x.get('key') or x.get('type') or '').lower()\n    value=x.get('api_key') or x.get('value') or x.get('key')\n    if name == 'anon' and isinstance(value,str) and value.count('.') == 2:\n        print(value)\n        break\nelse:\n    raise SystemExit('legacy anon JWT not available for smoke verification')\nPY\n          )\n          test -n "$SUPABASE_FUNCTION_SMOKE_JWT"\n          echo "::add-mask::$SUPABASE_FUNCTION_SMOKE_JWT"\n'''

          if 'api-keys?reveal=true' not in s:
              if marker not in s:
                  raise SystemExit('verification insertion marker missing')
              s = s.replace(marker, dynamic + marker, 1)

          if re.search(r'^\s{10}SUPABASE_FUNCTION_SMOKE_JWT:', s, flags=re.M):
              raise SystemExit('smoke JWT repository secret env reference still present')
          if 'api-keys?reveal=true' not in s:
              raise SystemExit('dynamic smoke JWT fetch patch missing')
          if removed_env < 1 and 'api-keys?reveal=true' not in s:
              raise SystemExit('no target env lines patched')

          p.write_text(s)

      - name: Commit promoter patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vl-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/vl-production-promoter.yml
          git diff --cached --quiet && { echo 'No patch needed'; exit 0; }
          git commit -m 'VL: derive Supabase smoke JWT from Management API'
          git push
