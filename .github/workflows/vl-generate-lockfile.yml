name: VL Generate Lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - cert/mobile-flutter-v1
    paths:
      - '.github/workflows/vl-generate-lockfile.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - name: Generate lockfile
        run: flutter pub get
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo 'pubspec.lock already matches Flutter 3.38.1 resolution.'
          else
            git commit -m 'VL cert: commit Flutter dependency lockfile'
            git fetch origin cert/mobile-flutter-v1
            git rebase origin/cert/mobile-flutter-v1
            git push origin HEAD:cert/mobile-flutter-v1
          fi
