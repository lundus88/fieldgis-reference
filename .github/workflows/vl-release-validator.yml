name: VL Release Validator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-release-validator.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vl-release-validator
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Get release OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-release-validator")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RAW")
          echo "::add-mask::$TOKEN"
          echo "VRS_RELEASE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Claim release validation job
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_RELEASE_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-release-oidc' \
            -d '{"action":"claim"}' > claim.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('claim.json'))
          print(json.dumps({k:d.get(k) for k in ('status','builder_key','job_id','factory_run_id','deployment_id','attempt')},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('status','builder_key','job_id','lease_token','factory_run_id','deployment_id'):
                  f.write(f"{k}={d.get(k,'')}\n")
          PY

      - name: No validation work
        if: steps.claim.outputs.status != 'leased'
        run: echo "No VL release validation job available."

      - name: Evaluate server-side gates
        if: steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > server-gates-request.json
          import json
          d=json.load(open('claim.json'))
          print(json.dumps({'action':'server_gates','factory_run_id':d['factory_run_id']}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_RELEASE_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-release-oidc' \
            --data-binary @server-gates-request.json > server-gates.json
          cat server-gates.json

      - name: Set up Java 21
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.38.1
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Materialize mobile release source
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work && mkdir -p release-work
          flutter create release-work/mobile --platforms=android --org com.vrslabs --project-name vl_generated_app
          rm -f release-work/mobile/test/widget_test.dart
          python3 - <<'PY'
          import json,pathlib,re
          d=json.load(open('claim.json')); root=pathlib.Path('release-work/mobile').resolve()
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if p.startswith('mobile/flutter/'): p=p[len('mobile/flutter/'):]
              elif p.startswith('mobile/'): p=p[len('mobile/'):]
              else: continue
              target=(root/p).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True)
              text=str(a.get('content') or '')
              if p.endswith(('.dart','.ts','.tsx','.js','.jsx')):
                  text=re.sub(r'\\n(?=(?:import|export|class|void|String|Future|Widget|const|final|var|enum|typedef|extension|mixin)\b)','\n',text)
              target.write_text(text)
          PY

      - name: Validate mobile runtime contracts
        id: mobile_validate
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        continue-on-error: true
        working-directory: release-work/mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'Geolocator.requestPermission' lib/main.dart
          grep -q 'Geolocator.getCurrentPosition' lib/main.dart
          grep -q 'SharedPreferences' lib/offline_store.dart
          grep -q 'pointsToCsv' lib/field_point.dart
          grep -q 'pointsToKml' lib/field_point.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug

      - name: Set up Node 22
        if: steps.claim.outputs.builder_key == 'gis-web-v1' || steps.claim.outputs.builder_key == 'web-react-v1' || steps.claim.outputs.builder_key == 'pwa-react-v1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GIS release contracts
        id: gis_validate
        if: steps.claim.outputs.builder_key == 'gis-web-v1'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work && mkdir -p release-work/gis/src
          cat > release-work/gis/package.json <<'JSON'
          {"name":"vl-release-gis","private":true,"scripts":{"check":"tsc --noEmit"},"dependencies":{"maplibre-gl":"6.6.0"},"devDependencies":{"typescript":"5.8.3"}}
          JSON
          cat > release-work/gis/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","strict":true,"skipLibCheck":true},"include":["src/**/*.ts"]}
          JSON
          python3 - <<'PY'
          import json,pathlib,re
          d=json.load(open('claim.json')); root=pathlib.Path('release-work/gis').resolve()
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if not p.startswith('gis/'): continue
              target=(root/p[len('gis/'):]).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True)
              text=re.sub(r'\\n(?=(?:import|export|class|function|const|let|var|interface|type)\b)','\n',str(a.get('content') or ''))
              target.write_text(text)
          PY
          cd release-work/gis
          npm install --ignore-scripts
          npm run check
          grep -R -q 'maplibre' src
          grep -R -E -q 'KML|kml|toKml|exportKml' src

      - name: Validate Web or PWA release contracts
        id: web_validate
        if: steps.claim.outputs.builder_key == 'web-react-v1' || steps.claim.outputs.builder_key == 'pwa-react-v1'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work && mkdir -p release-work/web/src release-work/web/public
          cat > release-work/web/package.json <<'JSON'
          {"name":"vl-release-web","private":true,"version":"0.0.0","type":"module","scripts":{"build":"vite build"},"dependencies":{"react":"19.2.8","react-dom":"19.2.8"},"devDependencies":{"vite":"8.2.2"}}
          JSON
          cat > release-work/web/index.html <<'HTML'
          <!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          HTML
          python3 - <<'PY'
          import json,pathlib,re
          d=json.load(open('claim.json')); root=pathlib.Path('release-work/web').resolve(); builder=d.get('builder_key')
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if not p.startswith('web/'): continue
              target=(root/p[len('web/'):]).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True)
              text=re.sub(r'\\n(?=(?:import|export|class|function|const|let|var|interface|type)\b)','\n',str(a.get('content') or ''))
              target.write_text(text)
          app=root/'src/App.tsx'; main=root/'src/main.tsx'
          if not app.exists() or not app.read_text().strip():
              app.write_text("import React from 'react';\nexport default function App(){return <main><h1>VL Generated Web</h1></main>}\n")
          if not main.exists() or not main.read_text().strip():
              main.write_text("import React from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App';\ncreateRoot(document.getElementById('root')!).render(<React.StrictMode><App/></React.StrictMode>);\n")
          if builder=='pwa-react-v1':
              manifest=root/'public/manifest.webmanifest'
              if not manifest.exists(): manifest.write_text(json.dumps({'name':'VL Generated PWA','short_name':'VL PWA','start_url':'/','display':'standalone'}))
              sw=root/'public/sw.js'
              if not sw.exists(): sw.write_text("self.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('fetch',()=>{});\n")
          PY
          cd release-work/web
          npm install --ignore-scripts
          npm run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          if [ '${{ steps.claim.outputs.builder_key }}' = 'pwa-react-v1' ]; then
            test -s dist/manifest.webmanifest
            test -s dist/sw.js
          fi

      - name: Set up Deno 2
        if: steps.claim.outputs.builder_key == 'api-service-v1'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate API release compile contract
        id: api_validate
        if: steps.claim.outputs.builder_key == 'api-service-v1'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-work && mkdir -p release-work/api
          python3 - <<'PY'
          import json,pathlib,re
          d=json.load(open('claim.json')); root=pathlib.Path('release-work/api').resolve()
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if not p.startswith('api/'): continue
              target=(root/p[len('api/'):]).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True)
              text=re.sub(r'\\n(?=(?:import|export|class|function|const|let|var|interface|type|Deno)\b)','\n',str(a.get('content') or ''))
              target.write_text(text)
          entry=root/'index.ts'
          if not entry.exists() or not entry.read_text().strip():
              raise SystemExit('api/index.ts missing')
          PY
          cd release-work/api
          deno check index.ts
          grep -q 'Deno.serve' index.ts

      - name: Build gate result payload
        if: always() && steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('claim.json')); b=d.get('builder_key'); gates=[]; ok=False
          if b=='mobile-flutter-v1':
              ok='${{ steps.mobile_validate.outcome }}'=='success'
              status='pass' if ok else 'fail'
              for key,evidence in [
                ('gps_runtime_contract',{'manifest_permissions':True,'geolocator_permission_flow':True,'get_current_position':True,'flutter_compile':ok}),
                ('offline_persistence_test',{'shared_preferences_store':True,'flutter_test':ok}),
                ('kml_csv_export_test',{'export_functions':True,'flutter_test':ok})]:
                  gates.append({'key':key,'status':status,'score':1 if ok else 0,'evidence':evidence})
          elif b=='gis-web-v1':
              ok='${{ steps.gis_validate.outcome }}'=='success'
              status='pass' if ok else 'fail'
              gates=[
                {'key':'map_compile_test','status':status,'score':1 if ok else 0,'evidence':{'typescript_compile':ok,'maplibre_source':True}},
                {'key':'kml_export_test','status':status,'score':1 if ok else 0,'evidence':{'kml_export_source_found':ok}}
              ]
          elif b in ('web-react-v1','pwa-react-v1'):
              ok='${{ steps.web_validate.outcome }}'=='success'
              status='pass' if ok else 'fail'
              gates=[{'key':'web_compile_test','status':status,'score':1 if ok else 0,'evidence':{'vite_build':ok,'index_html':ok,'javascript_bundle':ok}}]
              if b=='pwa-react-v1':
                  gates.append({'key':'pwa_runtime_contract','status':status,'score':1 if ok else 0,'evidence':{'manifest':ok,'service_worker':ok}})
          elif b=='api-service-v1':
              ok='${{ steps.api_validate.outcome }}'=='success'
              status='pass' if ok else 'fail'
              gates=[{'key':'api_compile_test','status':status,'score':1 if ok else 0,'evidence':{'deno_check':ok,'deno_serve_handler':ok}}]
          else:
              ok=False
          pathlib.Path('validator-result.json').write_text(json.dumps({'ok':ok,'gate_results':gates,'builder_key':b,'github_run_id':'${{ github.run_id }}','github_sha':'${{ github.sha }}'}))
          PY
          cat validator-result.json

      - name: Callback release validation
        if: always() && steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > callback.json
          import json
          claim=json.load(open('claim.json')); result=json.load(open('validator-result.json'))
          print(json.dumps({'action':'complete','job_id':claim['job_id'],'lease_token':claim['lease_token'],'success':result['ok'],'gate_results':result['gate_results'],'result':{'runner':'github-actions-oidc','github_run_id':result['github_run_id'],'github_sha':result['github_sha'],'builder_key':result['builder_key']},'error_text':None if result['ok'] else 'Release validation contract failed or builder adapter unavailable'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_RELEASE_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-release-oidc' \
            --data-binary @callback.json | tee callback-response.json
