name: LUNDUS DIGITAL SYSTEMS Integrated Customer Lifecycle Gate
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-integrated-customer-lifecycle-gate/**'
      - '.github/workflows/lds-integrated-customer-lifecycle-gate.yml'
permissions:
  contents: read
jobs:
  lifecycle-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-integrated-customer-lifecycle-gate/check_lifecycle_gate.py
      - working-directory: docs/commercial/lds-integrated-customer-lifecycle-gate
        run: python3 -m unittest -v test_lifecycle_gate.py
