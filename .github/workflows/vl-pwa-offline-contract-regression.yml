name: VL PWA Offline Contract Regression

on:
  pull_request:
    paths:
      - 'vl/migrations/20260918_pwa_offline_contract_semantic_validator.sql'
      - 'vl/tests/check_pwa_offline_contract_semantics.py'
      - '.github/workflows/vl-pwa-offline-contract-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline PWA semantic regression
        run: python3 vl/tests/check_pwa_offline_contract_semantics.py
