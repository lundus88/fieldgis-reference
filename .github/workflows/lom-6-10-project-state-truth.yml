name: LOM 6.10 Project State Truth

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-6-10-project-state-truth-layer/**'
      - 'vl/lom-operational-safety/event_ledger.py'
      - '.github/workflows/lom-6-10-project-state-truth.yml'
  push:
    branches: [main]
    paths:
      - 'vl/lom-6-10-project-state-truth-layer/**'
      - 'vl/lom-operational-safety/event_ledger.py'
      - '.github/workflows/lom-6-10-project-state-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-state-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run Project State Truth regression
        working-directory: vl/lom-6-10-project-state-truth-layer
        run: python -m unittest -v test_project_state_truth.py
