name: VL Golden Factory Proof (DEV Only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vl-golden-factory-proof.yml'
      - 'vl/proof/**'
      - 'vl/agent-control-plane/**'

permissions:
  contents: read

concurrency:
  group: vl-golden-factory-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-intake-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run deterministic natural-language and routing benchmark
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 vl/proof/run_golden_factory_benchmark.py \
            --cases vl/proof/golden-benchmark-cases.json \
            --output evidence/golden-factory-manifest.json \
            --source-sha '${{ github.sha }}'
      - name: Verify fail-closed phase-one manifest
        run: |
          set -euo pipefail
          python3 vl/proof/verify_golden_factory_manifest.py \
            evidence/golden-factory-manifest.json \
            --expected-sha '${{ github.sha }}'
      - name: Prove autonomous production approval remains unavailable
        working-directory: vl/agent-control-plane
        run: |
          set -euo pipefail
          python3 run_runtime_policy_tests.py | tee ../../evidence/acp-runtime-policy.json
          grep -q 'REQUIRE_HUMAN_PRODUCTION_APPROVAL' ../../evidence/acp-runtime-policy.json
      - name: Package phase-one evidence
        run: |
          set -euo pipefail
          sha256sum evidence/* > evidence/SHA256SUMS
          tar -czf vl-golden-factory-proof-${{ github.run_id }}.tgz evidence
      - name: Upload immutable audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl-golden-factory-proof-${{ github.run_id }}
          path: vl-golden-factory-proof-${{ github.run_id }}.tgz
          if-no-files-found: error
          retention-days: 90

  hold-until-dev-evidence:
    runs-on: ubuntu-latest
    needs: deterministic-intake-routing
    steps:
      - name: Record phase boundary
        run: |
          set -euo pipefail
          echo 'HOLD: deterministic intake/routing proof passed.'
          echo 'PASS—PROVEN is forbidden until current-HEAD builder, sandbox, QA, certification, protected human DEV approval, rollback, and three-run reproducibility evidence is attached.'
          echo 'No production action was requested or performed.'
          exit 1
