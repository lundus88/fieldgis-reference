name: VL Golden API Staging Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-golden-api-staging-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe staging API auth and data contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            'https://xcwojrufksxvvrajtmuo.supabase.co/functions/v1/vl-golden-api-probe' \
            -o probe.json
          python3 - <<'PY'
          import json
          d=json.load(open('probe.json'))
          print(json.dumps(d,indent=2,sort_keys=True))
          assert d.get('ok') is True, 'staging probe did not pass'
          assert d.get('unauth_status') == 401, 'unauthenticated request was not rejected'
          assert d.get('auth_status') == 200, 'authenticated request did not succeed'
          assert d.get('auth_ok') is True, 'authenticated JSON contract did not return ok=true'
          assert d.get('service_present') is True, 'service field missing from response'
          print('VL_GOLDEN_API_HTTP_E2E_PASS')
          PY
