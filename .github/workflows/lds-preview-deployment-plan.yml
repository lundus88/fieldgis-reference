name: LDS Preview Deployment Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/commercial/LDS_PREVIEW_DEPLOYMENT_PLAN.md'
      - 'docs/commercial/LDS_PREVIEW_DEPLOYMENT_CONTRACT.json'
      - 'docs/commercial/check_preview_deployment_contract.py'
      - '.github/workflows/lds-preview-deployment-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 docs/commercial/check_preview_deployment_contract.py
