name: LOM OpenTelemetry GenAI Adapter P0

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-opentelemetry-genai-p0/**'
      - 'vl/lom-macro-evaluation-p0/**'
      - 'vl/lom-6-11-live-operational-evidence-fabric/**'
      - '.github/workflows/lom-opentelemetry-genai-p0.yml'
  push:
    branches: [main]
    paths:
      - 'vl/lom-opentelemetry-genai-p0/**'
      - 'vl/lom-macro-evaluation-p0/**'
      - 'vl/lom-6-11-live-operational-evidence-fabric/**'
      - '.github/workflows/lom-opentelemetry-genai-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otel-genai-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile adapter
        run: python -m py_compile vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py

      - name: Run adapter tests
        working-directory: vl/lom-opentelemetry-genai-p0
        run: python -m unittest -v test_otel_genai_adapter.py

      - name: Re-run Macro Evaluation regression
        working-directory: vl/lom-macro-evaluation-p0
        run: python test_macro_evaluation.py

      - name: Assert privacy and authority boundary
        run: |
          grep -q 'AUTONOMOUS_CEILING = "PREPARE_PR"' vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py
          grep -q 'EXECUTION_AUTHORITY = "NONE"' vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py
          grep -q 'PRODUCTION_AUTHORITY = "HUMAN_ONLY"' vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py
          grep -q 'PROTECTED_MAIN_MERGE = "HUMAN_ONLY"' vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py
          grep -q '"network_export": "DISABLED"' vl/lom-opentelemetry-genai-p0/otel_genai_adapter.py
