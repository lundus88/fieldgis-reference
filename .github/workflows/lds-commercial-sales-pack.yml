name: LDS Commercial Sales Pack

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/commercial/templates/**'
      - 'docs/commercial/check_sales_pack.py'
      - '.github/workflows/lds-commercial-sales-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate sales pack guardrails
        run: python3 docs/commercial/check_sales_pack.py
