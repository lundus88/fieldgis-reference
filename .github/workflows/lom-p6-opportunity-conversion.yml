name: LOM P6 Opportunity Conversion

on:
  pull_request:
    paths:
      - 'vl/lom-opportunity-conversion/**'
      - '.github/workflows/lom-p6-opportunity-conversion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run conversion tests
        run: python -m unittest vl/lom-opportunity-conversion/test_conversion.py
      - name: Evaluate conversion queue
        run: python vl/lom-opportunity-conversion/evaluate_conversion.py
