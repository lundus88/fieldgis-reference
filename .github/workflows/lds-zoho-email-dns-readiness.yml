name: LUNDUS DIGITAL SYSTEMS Zoho Email DNS Readiness
on:
  pull_request:
    paths:
      - 'docs/commercial/LDS_DOMAIN_EMAIL_READINESS.json'
      - 'docs/commercial/LDS_ZOHO_EMAIL_DNS_READINESS.json'
      - 'docs/commercial/LDS_ZOHO_DNS_EVIDENCE_CAPTURE_GUIDE.md'
      - 'docs/commercial/check_zoho_email_dns_readiness.py'
      - '.github/workflows/lds-zoho-email-dns-readiness.yml'
permissions:
  contents: read
jobs:
  zoho-email-dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/check_zoho_email_dns_readiness.py
