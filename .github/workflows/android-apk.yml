name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create . --platforms=android --org com.vrslabs --project-name fieldgis_reference

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms)
          p.write_text(s)
          PY

      - name: Write CI-safe model test after scaffold generation
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:fieldgis_reference/main.dart';

          void main() {
            test('FieldPoint JSON roundtrip', () {
              final createdAt = DateTime.utc(2026, 8, 25, 12, 0);
              final point = FieldPoint(
                id: 'test-point-1',
                code: 'P001',
                latitude: 5.9804,
                longitude: 116.0735,
                accuracyM: 3.5,
                createdAt: createdAt,
              );
              final restored = FieldPoint.fromJson(point.toJson());
              expect(restored.id, point.id);
              expect(restored.code, point.code);
              expect(restored.latitude, point.latitude);
              expect(restored.longitude, point.longitude);
              expect(restored.accuracyM, point.accuracyM);
              expect(restored.createdAt, point.createdAt);
            });
          }
          DART

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldgis-reference-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
