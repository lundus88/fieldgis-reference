name: LOM Direct VPS Ingress Deploy P0

on:
  push:
    branches: [lom/direct-vps-ingress-deploy-p0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  direct-vps-ingress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Secure ingress regression
        run: |
          cd vl/lom-secure-task-ingress-v1
          python3 test_secure_task_ingress.py
          python3 test_ingress_server.py
      - name: Existing VPS executor regression
        run: |
          cd vl/lom-vps-execution-node-p0
          python3 test_runner.py
          python3 test_body_executor_adapter.py
      - name: Existing ACP policy regression
        run: |
          cd vl/agent-control-plane
          python3 run_runtime_policy_tests.py
          python3 run_nonproduction_transition_tests.py
      - name: Deployment contract remains private
        run: |
          grep -q 'LOM_INGRESS_BIND=127.0.0.1' vl/lom-secure-task-ingress-v1/deploy/lom-secure-ingress.service
          ! grep -q 'LOM_INGRESS_BIND=0.0.0.0' vl/lom-secure-task-ingress-v1/deploy/lom-secure-ingress.service
          ! grep -R -E '(OPENAI_API_KEY|SUPABASE_SERVICE_ROLE_KEY|GITHUB_TOKEN)=' vl/lom-secure-task-ingress-v1/deploy
