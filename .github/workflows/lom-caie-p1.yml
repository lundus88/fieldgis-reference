name: LOM CAIE P1

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caie-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile CAIE P1 runtime
        run: python -m py_compile vl/lom-continuous-improvement/caie_p1.py

      - name: Run CAIE P1 regression suite
        run: python vl/lom-continuous-improvement/test_caie_p1.py

      - name: Re-run CAIE P0.1 regression suite
        run: python vl/lom-continuous-improvement/test_caie.py
