name: LD Ready Business Kit P2
on:
  push:
    branches: [ld/ready-business-kit-p2-first-customer-scale]
  pull_request:
    branches: [main]
    paths:
      - 'vl/ld-ready-business-kit-p0/**'
      - '.github/workflows/ld-ready-business-kit-p2.yml'

permissions:
  contents: read

jobs:
  p2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: P0 regressions
        run: |
          cd vl/ld-ready-business-kit-p0
          python3 test_ready_business_kit.py
      - name: P1 regressions
        run: |
          cd vl/ld-ready-business-kit-p0
          python3 test_ready_business_p1.py
      - name: P2 regressions
        run: |
          cd vl/ld-ready-business-kit-p0
          python3 test_ready_business_p2.py
      - name: Build synthetic scale evidence
        run: |
          cd vl/ld-ready-business-kit-p0
          python3 build_p2_scale_report.py
      - name: Verify fail-closed scale artifacts
        run: |
          f=vl/ld-ready-business-kit-p0/generated-p2/synthetic-10-client-report.json
          test -f "$f"
          grep -q '"synthetic_only": true' "$f"
          grep -q '"live_customers": false' "$f"
          grep -q '"revenue_evidence": false' "$f"
          grep -q '"payment_transactions": 0' "$f"
          grep -q '"production_deployments": 0' "$f"
          grep -q '"activation_authorized": false' "$f"
