name: VL Mobile Core Certification

on:
  workflow_dispatch:
  push:
    branches:
      - cert/mobile-flutter-v1
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'vl/certification/**'
      - '.github/workflows/vl-mobile-cert-core.yml'

permissions:
  contents: read

jobs:
  policy-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate certification state policy
        run: |
          STATE=$(awk '/^certification:/{in_cert=1; next} in_cert && /^  state:/{print $2; exit}' vl/certification/mobile-flutter-v1.yaml)
          if [ "$STATE" = "pending" ]; then
            python3 tool/vl_cert_gate.py vl/certification/mobile-flutter-v1.yaml --mode pending
            if python3 tool/vl_cert_gate.py vl/certification/mobile-flutter-v1.yaml --mode activation; then
              echo 'Activation unexpectedly allowed while certification is pending.'
              exit 1
            fi
            echo 'Activation correctly blocked while certification is pending.'
          elif [ "$STATE" = "approved" ]; then
            python3 tool/vl_cert_gate.py vl/certification/mobile-flutter-v1.yaml --mode activation
            echo 'Approved certification correctly satisfies activation policy.'
          else
            echo "Unsupported certification state: $STATE"
            exit 1
          fi
      - name: Validate rollback target
        run: python3 tool/vl_cert_gate.py vl/certification/mobile-flutter-v1.yaml --mode rollback

  runtime-config-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create . --platforms=android --org com.vrslabs --project-name fieldgis_reference
      - name: Rewrite generated smoke test
        run: |
          cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:fieldgis_reference/main.dart';
          void main() {
            test('FieldPoint JSON roundtrip', () {
              final createdAt = DateTime.utc(2026, 8, 25, 12, 0);
              final p = FieldPoint(id: 'cert', code: 'C001', latitude: 5.9, longitude: 116.0, accuracyM: 3, createdAt: createdAt);
              expect(FieldPoint.fromJson(p.toJson()).code, 'C001');
            });
          }
          DART
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Validate config injection and structured logging
        run: flutter test test/vl_runtime_cert_test.dart --dart-define=VL_CERT_ENV=certification

  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - name: Require committed lockfile
        run: |
          test -f pubspec.lock
          git ls-files --error-unmatch pubspec.lock
      - name: Verify locked dependency resolution
        run: flutter pub get --enforce-lockfile

  reproducible-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create . --platforms=android --org com.vrslabs --project-name fieldgis_reference
      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace(marker, perms)
          p.write_text(s)
          PY
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build payload A
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=VL_CERT_ENV=certification
      - name: Hash normalized payload A
        run: |
          rm -rf /tmp/apk-a && mkdir -p /tmp/apk-a
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d /tmp/apk-a
          find /tmp/apk-a -type f ! -path '*/META-INF/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/a.sha
      - name: Clean and rebuild payload B
        run: |
          flutter clean
          flutter pub get
          flutter build apk --debug --target-platform android-arm64 --dart-define=VL_CERT_ENV=certification
      - name: Hash normalized payload B and compare
        run: |
          rm -rf /tmp/apk-b && mkdir -p /tmp/apk-b
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d /tmp/apk-b
          find /tmp/apk-b -type f ! -path '*/META-INF/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/b.sha
          sed 's#/tmp/apk-a#/APK#' /tmp/a.sha > /tmp/a.normalized
          sed 's#/tmp/apk-b#/APK#' /tmp/b.sha > /tmp/b.normalized
          diff -u /tmp/a.normalized /tmp/b.normalized
