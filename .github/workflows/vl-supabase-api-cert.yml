name: VL Supabase API Certification

on:
  workflow_dispatch:
  push:
    branches:
      - cert/mobile-flutter-v1
    paths:
      - 'tool/vl_supabase_api_check.dart'
      - '.github/workflows/vl-supabase-api-cert.yml'

permissions:
  contents: read

jobs:
  supabase-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VL_SUPABASE_URL: https://wczelfmnqpgzfdszxubl.supabase.co
      VL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_lWy0g5rcNuhg52xpI9w7Og_2bGXLiOR
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Run Supabase Data API health check
        run: dart run tool/vl_supabase_api_check.dart
