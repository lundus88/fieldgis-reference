name: VL Cinematic Pages Preview

on:
  pull_request:
    paths:
      - 'vl/public/cinematic-home-malaysia.html'
      - 'vl/public/vl-cinematic-globe.js'
      - 'vl/public/vl-malaysia-industries.js'
      - '.github/workflows/vl-cinematic-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vl-cinematic-pages-preview-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 132
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static preview
        run: |
          rm -rf _site
          mkdir -p _site
          cp vl/public/cinematic-home-malaysia.html _site/index.html
          cp vl/public/vl-cinematic-globe.js _site/vl-cinematic-globe.js
          cp vl/public/vl-malaysia-industries.js _site/vl-malaysia-industries.js
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          test -s _site/index.html
          test -s _site/vl-cinematic-globe.js
          test -s _site/vl-malaysia-industries.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
