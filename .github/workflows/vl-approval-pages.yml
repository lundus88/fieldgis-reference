name: VL Approval Console Pages

on:
  push:
    branches: [main]
    paths:
      - 'vl/approval/console/**'
      - 'vl/public/**'
      - '.github/workflows/vl-approval-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vl-approval-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/public
          cp vl/approval/console/*.html _site/
          cp vl/public/*.html _site/public/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
