name: VL Approval Console Pages

on:
  push:
    branches: [main]
    paths:
      - 'vl/approval/console/**'
      - 'vl/public/**'
      - '.github/workflows/vl-approval-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vl-approval-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/public
          cp vl/approval/console/*.html _site/
          cp -R vl/public/. _site/public/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
