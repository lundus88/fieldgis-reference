name: LOM 6.8 Governed PR Evidence Promotion

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-6-8-governed-pr-evidence-promotion/**'
      - '.github/workflows/lom-6-8-governed-pr-evidence-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run LOM 6.8 regression suite
        working-directory: vl/lom-6-8-governed-pr-evidence-promotion
        run: python -m unittest -v test_promotion.py
