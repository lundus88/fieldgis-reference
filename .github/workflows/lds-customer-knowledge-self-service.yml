name: LUNDUS DIGITAL SYSTEMS Customer Knowledge Self Service
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-customer-knowledge-self-service/**'
      - '.github/workflows/lds-customer-knowledge-self-service.yml'
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-customer-knowledge-self-service/check_knowledge_center.py
      - working-directory: docs/commercial/lds-customer-knowledge-self-service
        run: python3 -m unittest -v test_knowledge_center.py
