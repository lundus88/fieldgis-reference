name: LD Unified Job Command Center
on:
  push:
    branches: [ld/unified-job-command-center-p0]
  pull_request:
    branches: [main]
    paths:
      - 'docs/commercial/lds-unified-job-command-center/**'
      - '.github/workflows/lds-unified-job-command-center.yml'

permissions:
  contents: read

jobs:
  command-center:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Test command center invariants
        run: |
          cd docs/commercial/lds-unified-job-command-center
          python3 test_job_command_center.py
      - name: Verify non-Production posture
        run: |
          grep -q '"production_activation_authorized": false' docs/commercial/lds-unified-job-command-center/contract.json
          grep -q 'No lifecycle advance without valid evidence' docs/commercial/lds-unified-job-command-center/README.md
