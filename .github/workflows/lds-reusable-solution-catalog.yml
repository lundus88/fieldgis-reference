name: LUNDUS DIGITAL SYSTEMS Reusable Solution Catalog
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-reusable-solution-catalog/**'
      - '.github/workflows/lds-reusable-solution-catalog.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-reusable-solution-catalog/check_solution_catalog.py
      - working-directory: docs/commercial/lds-reusable-solution-catalog
        run: python3 -m unittest -v test_solution_catalog.py
