name: VL Golden Reproducibility Proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to reproduce
        required: true
        type: string

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Confirm exact source SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Reproduce deterministic intake manifest twice
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 vl/proof/run_golden_factory_benchmark.py \
            --cases vl/proof/golden-benchmark-cases.json \
            --output evidence/manifest-a.json \
            --source-sha "$SOURCE_SHA"
          python3 vl/proof/run_golden_factory_benchmark.py \
            --cases vl/proof/golden-benchmark-cases.json \
            --output evidence/manifest-b.json \
            --source-sha "$SOURCE_SHA"
          cmp evidence/manifest-a.json evidence/manifest-b.json
          python3 vl/proof/verify_golden_factory_manifest.py \
            evidence/manifest-a.json \
            --expected-sha "$SOURCE_SHA"
      - name: Produce reproducibility evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sha256sum evidence/manifest-a.json > evidence/manifest.sha256
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('evidence/manifest-a.json')
          payload={
            'schema_version':'vl.reproducibility-run/1',
            'status':'PASS',
            'source_sha':os.environ['SOURCE_SHA'],
            'workflow_run_id':int(os.environ['RUN_ID']),
            'manifest_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'production_mutation':False
          }
          Path('evidence/reproducibility.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl-golden-reproducibility-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
