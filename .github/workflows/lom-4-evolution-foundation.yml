name: LOM 4.0 Evolution Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-4-evolution/**'
      - '.github/workflows/lom-4-evolution-foundation.yml'
  push:
    branches: [lom-4-evolution-foundation]
    paths:
      - 'vl/lom-4-evolution/**'
      - '.github/workflows/lom-4-evolution-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate constitution and role boundaries
        run: python vl/lom-4-evolution/validate_foundation.py
      - name: Run adversarial tests
        run: |
          python -m pip install pytest
          python -m pytest -q vl/lom-4-evolution/test_foundation.py
