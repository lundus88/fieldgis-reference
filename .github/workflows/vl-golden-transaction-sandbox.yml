name: VL Golden Transaction Sandbox

on:
  push:
    branches: ['vl/golden-transaction-payment-notification']
    paths:
      - '.github/workflows/vl-golden-transaction-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  payment-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Get Billplz sandbox OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-billplz-sandbox-cert")
          token=$(printf '%s' "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Verify Billplz sandbox certification endpoint
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/payment.json -w '%{http_code}' -X POST \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vl-billplz-ci-sandbox' \
            -H "Authorization: Bearer $OIDC_TOKEN")
          cat /tmp/payment.json
          test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/payment.json'))
          assert d['ok'] is True
          assert d['environment']=='sandbox'
          assert d['checkout_created'] is True
          assert d['reconciliation_pass'] is True
          assert d['due_bill_cancelled'] is True
          assert d['live_charge'] is False
          PY
      - name: Scope guard
        run: |
          echo 'Sandbox only. No live charge. No production promotion.'
          echo 'This gate proves provider connectivity/create/reconcile/cancel only.'
          echo 'Paid callback + fulfillment + notification remain separate evidence gates.'
