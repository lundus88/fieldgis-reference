name: LOM 2.0 Gate E Orchestrator

on:
  pull_request:
    paths:
      - 'vl/lom-gate-e-orchestrator/**'
      - '.github/workflows/lom-2-gate-e-orchestrator.yml'
  push:
    branches:
      - lom-2-gate-e-orchestrator
    paths:
      - 'vl/lom-gate-e-orchestrator/**'
      - '.github/workflows/lom-2-gate-e-orchestrator.yml'

jobs:
  orchestrator-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Gate E regression tests
        working-directory: vl/lom-gate-e-orchestrator
        run: python -m pytest -q
