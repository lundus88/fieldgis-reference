name: LUNDUS DIGITAL SYSTEMS Fast Delivery System

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-fast-delivery/**'
      - 'docs/commercial/templates/QUOTATION_TEMPLATE_BM.md'
      - 'docs/commercial/templates/DELIVERY_ACCEPTANCE_TEMPLATE_BM.md'
      - '.github/workflows/lds-fast-delivery.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/commercial/lds-fast-delivery/**'
      - 'docs/commercial/templates/QUOTATION_TEMPLATE_BM.md'
      - 'docs/commercial/templates/DELIVERY_ACCEPTANCE_TEMPLATE_BM.md'
      - '.github/workflows/lds-fast-delivery.yml'

permissions:
  contents: read

jobs:
  fast-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate FDS contract
        run: python3 docs/commercial/lds-fast-delivery/check_fast_delivery.py
      - name: Run FDS tests
        working-directory: docs/commercial/lds-fast-delivery
        run: python3 -m unittest -v test_fast_delivery.py
