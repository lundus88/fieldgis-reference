name: VL Commercial Payment Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/functions/vl-billplz-create-production/**'
      - 'vl/functions/vl-billplz-webhook-production/**'
      - 'vl/migrations/20260918_commercial_payment_production_readiness.sql'
      - 'vl/tests/check_commercial_payment_production_readiness.py'
      - '.github/workflows/vl-commercial-payment-production-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate commercial payment fail-closed contract
        run: python3 vl/tests/check_commercial_payment_production_readiness.py
