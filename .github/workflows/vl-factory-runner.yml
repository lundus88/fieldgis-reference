name: VL Factory Runner
on:
  workflow_dispatch:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/vl-factory-runner.yml', 'vl/runner/**']
permissions:
  contents: read
concurrency: {group: vl-factory-runner, cancel-in-progress: false}
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, id-token: write}
    outputs:
      status: ${{ steps.c.outputs.status }}
      builder_key: ${{ steps.c.outputs.builder_key }}
      factory_run_id: ${{ steps.c.outputs.factory_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: c
        shell: bash
        run: |
          set -euo pipefail
          R=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-factory-runner")
          T=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$R"); echo "::add-mask::$T"
          curl -fsSL -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' 'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-runner-oidc' -d '{"action":"claim"}' > claim.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('claim.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
           for k in ('status','builder_key','factory_run_id'): f.write(f"{k}={d.get(k,'')}\n")
          if d.get('status')=='leased':
           s={k:d.get(k) for k in ('factory_run_id','builder_key','app_spec','generated_artifacts')};s['schema_version']=1
           json.dump(s,open('raw.json','w'));json.dump({'job_id':d['job_id'],'lease_token':d['lease_token'],'factory_run_id':d['factory_run_id']},open('control.json','w'))
          PY
          if [ "$(python3 -c "import json;print(json.load(open('claim.json')).get('status',''))")" = leased ]; then python3 vl/runner/validate-build-contract.py raw.json build-contract.json; fi
      - if: steps.c.outputs.status == 'leased'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'vl-contract-${{ steps.c.outputs.factory_run_id }}', path: build-contract.json, if-no-files-found: error, retention-days: 1}
      - if: steps.c.outputs.status == 'leased'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'vl-harness-${{ steps.c.outputs.factory_run_id }}', path: 'vl/runner/', if-no-files-found: error, retention-days: 1}
      - if: steps.c.outputs.status == 'leased'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'vl-control-${{ steps.c.outputs.factory_run_id }}', path: control.json, if-no-files-found: error, retention-days: 1}
  build:
    needs: claim
    if: needs.claim.outputs.status == 'leased'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: {contents: read}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'vl-contract-${{ needs.claim.outputs.factory_run_id }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'vl-harness-${{ needs.claim.outputs.factory_run_id }}', path: vl-harness}
      - shell: bash
        run: |
          chmod +x vl-harness/*.sh vl-harness/*.py
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" && test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          ! env | grep -E 'SUPABASE_SERVICE_ROLE_KEY|VRS_OIDC_TOKEN|VERCEL_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY'
      - if: needs.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21'}
      - if: needs.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: {flutter-version: '3.38.1', channel: stable, cache: true}
      - if: contains(fromJSON('["gis-web-v1","web-react-v1","pwa-react-v1"]'), needs.claim.outputs.builder_key)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', registry-url: 'https://registry.npmjs.org'}
      - if: needs.claim.outputs.builder_key == 'api-service-v1'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: {deno-version: v2.x}
      - id: b
        continue-on-error: true
        run: python3 vl-harness/run-build.py build-contract.json
      - id: r
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.b.outcome }}' != success ] || [ ! -f build-result.json ]; then python3 vl-harness/result-contract.py failure; fi
          python3 vl-harness/result-contract.py outputs
      - if: steps.r.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'vl-factory-${{ needs.claim.outputs.factory_run_id }}-${{ needs.claim.outputs.builder_key }}', path: '${{ steps.r.outputs.path }}', if-no-files-found: error, retention-days: 90}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'vl-result-${{ needs.claim.outputs.factory_run_id }}', path: build-result.json, if-no-files-found: error, retention-days: 90}
  callback:
    needs: [claim, build]
    if: always() && needs.claim.outputs.status == 'leased'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'vl-result-${{ needs.claim.outputs.factory_run_id }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'vl-control-${{ needs.claim.outputs.factory_run_id }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'vl-harness-${{ needs.claim.outputs.factory_run_id }}', path: vl-harness}
      - shell: bash
        env:
          VL_ARTIFACT_NAME: vl-factory-${{ needs.claim.outputs.factory_run_id }}-${{ needs.claim.outputs.builder_key }}
          VL_FACTORY_RUN_ID: ${{ needs.claim.outputs.factory_run_id }}
          VL_BUILDER_KEY: ${{ needs.claim.outputs.builder_key }}
        run: |
          set -euo pipefail
          chmod +x vl-harness/result-contract.py
          R=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-factory-runner")
          T=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$R"); echo "::add-mask::$T"
          python3 vl-harness/result-contract.py callback > callback.json
          curl -fsSL -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' 'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-runner-oidc' --data-binary @callback.json
