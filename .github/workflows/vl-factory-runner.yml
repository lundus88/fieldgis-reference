name: VL Factory Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-factory-runner.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: vl-factory-runner
  cancel-in-progress: false

jobs:
  run-factory-job:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-factory-runner")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RAW")
          echo "::add-mask::$TOKEN"
          echo "VRS_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Claim VL factory job
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-runner-oidc' \
            -d '{"action":"claim"}' > claim.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('claim.json'))
          print(json.dumps({k:d.get(k) for k in ('status','builder_key','job_id','factory_run_id','attempt')},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('status','builder_key','job_id','lease_token','factory_run_id'):
                  f.write(f"{k}={d.get(k,'')}\n")
          PY

      - name: No queued work
        if: steps.claim.outputs.status != 'leased'
        run: echo "No VL factory job available."

      - name: Set up Java 21
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Prepare Android workspace
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workspace && mkdir -p workspace
          flutter create workspace/mobile --platforms=android --org com.vrslabs --project-name vl_generated_app
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('claim.json')); root=pathlib.Path('workspace/mobile').resolve()
          title=((d.get('app_spec') or {}).get('title') or 'VL Generated App').replace("'",'')
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if p.startswith('mobile/flutter/'): p=p[len('mobile/flutter/'):]
              elif p.startswith('mobile/'): p=p[len('mobile/'):]
              else: continue
              target=(root/p).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True); target.write_text(str(a.get('content') or ''))
          main=root/'lib/main.dart'
          if not main.exists() or not main.read_text().strip():
              main.write_text("import 'package:flutter/material.dart';\nvoid main()=>runApp(const App());\nclass App extends StatelessWidget{const App({super.key});@override Widget build(BuildContext c)=>MaterialApp(home:Scaffold(appBar:AppBar(title:const Text('"+title+"')),body:const Center(child:Text('Generated by VL Software Factory'))));}\n")
          PY

      - name: Build Android artifact
        id: mobile_build
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1'
        continue-on-error: true
        working-directory: workspace/mobile
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../../runner-mobile.log
          flutter analyze --no-fatal-infos 2>&1 | tee -a ../../runner-mobile.log
          flutter build apk --debug 2>&1 | tee -a ../../runner-mobile.log
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > ../../runner-sha256.txt

      - name: Set up Node 22
        if: steps.claim.outputs.builder_key == 'gis-web-v1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web GIS workspace
        if: steps.claim.outputs.builder_key == 'gis-web-v1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf workspace && mkdir -p workspace/gis/src
          cat > workspace/gis/package.json <<'JSON'
          {"name":"vl-generated-gis","private":true,"version":"0.0.0","scripts":{"check":"tsc --noEmit","build":"tsc"},"dependencies":{"maplibre-gl":"6.6.0"},"devDependencies":{"typescript":"5.8.3"}}
          JSON
          cat > workspace/gis/tsconfig.json <<'JSON'
          {"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","strict":true,"outDir":"dist","skipLibCheck":true},"include":["src/**/*.ts"]}
          JSON
          python3 - <<'PY'
          import json,pathlib
          d=json.load(open('claim.json')); root=pathlib.Path('workspace/gis').resolve()
          for a in d.get('generated_artifacts') or []:
              p=str(a.get('path') or '')
              if not p.startswith('gis/'): continue
              target=(root/p[len('gis/'):]).resolve()
              if root not in target.parents and target!=root: raise SystemExit('unsafe artifact path')
              target.parent.mkdir(parents=True,exist_ok=True); target.write_text(str(a.get('content') or ''))
          entry=root/'src/map.ts'
          if not entry.exists(): entry.write_text("import maplibregl from 'maplibre-gl';\nexport function createMap(container:string){return new maplibregl.Map({container,style:'https://demotiles.maplibre.org/style.json',center:[116.0735,5.9804],zoom:10});}\n")
          PY

      - name: Build Web GIS artifact
        id: gis_build
        if: steps.claim.outputs.builder_key == 'gis-web-v1'
        continue-on-error: true
        working-directory: workspace/gis
        shell: bash
        run: |
          set -o pipefail
          npm install --ignore-scripts 2>&1 | tee ../../runner-gis.log
          npm run check 2>&1 | tee -a ../../runner-gis.log
          npm run build 2>&1 | tee -a ../../runner-gis.log
          tar -czf ../vl-gis-build.tgz dist package.json package-lock.json
          sha256sum ../vl-gis-build.tgz > ../../runner-sha256.txt

      - name: Determine runner result
        id: result
        if: always() && steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          BUILDER='${{ steps.claim.outputs.builder_key }}'
          OK=false
          if [ "$BUILDER" = 'mobile-flutter-v1' ] && [ '${{ steps.mobile_build.outcome }}' = 'success' ]; then OK=true; fi
          if [ "$BUILDER" = 'gis-web-v1' ] && [ '${{ steps.gis_build.outcome }}' = 'success' ]; then OK=true; fi
          SHA=''
          if [ -f runner-sha256.txt ]; then SHA=$(awk '{print $1}' runner-sha256.txt); fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload Android runner artifact
        if: steps.claim.outputs.builder_key == 'mobile-flutter-v1' && steps.result.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vl-factory-${{ steps.claim.outputs.factory_run_id }}-android
          path: workspace/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload GIS runner artifact
        if: steps.claim.outputs.builder_key == 'gis-web-v1' && steps.result.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vl-factory-${{ steps.claim.outputs.factory_run_id }}-gis
          path: workspace/vl-gis-build.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Callback VL
        if: always() && steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > callback.json
          import json
          claim=json.load(open('claim.json'))
          ok='${{ steps.result.outputs.ok }}'=='true'
          result={'runner':'github-actions-oidc','builder_key':'${{ steps.claim.outputs.builder_key }}','github_run_id':'${{ github.run_id }}','github_sha':'${{ github.sha }}','artifact_sha256':'${{ steps.result.outputs.sha }}','qa_result':'PASS' if ok else 'FAIL'}
          print(json.dumps({'action':'complete','job_id':claim['job_id'],'lease_token':claim['lease_token'],'success':ok,'result':result,'error_text':None if ok else 'GitHub runner build or validation failed'}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-runner-oidc' \
            --data-binary @callback.json | tee callback-response.json
