name: LDS Activation Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/commercial/LDS_ACTIVATION_SNAPSHOT.json'
      - 'docs/commercial/check_activation_snapshot.py'
      - '.github/workflows/lds-activation-snapshot.yml'
      - 'docs/commercial/LDS_FINAL_COMMERCIAL_ACTIVATION_GATE.md'
      - 'docs/commercial/LDS_BUSINESS_LICENCE_EVIDENCE.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate activation snapshot contract
        run: python3 docs/commercial/check_activation_snapshot.py
