name: LUNDUS DIGITAL SYSTEMS Customer Renewal Expansion
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-customer-renewal-expansion/**'
      - '.github/workflows/lds-customer-renewal-expansion.yml'
permissions:
  contents: read
jobs:
  renewal-expansion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-customer-renewal-expansion/check_renewal_expansion.py
      - working-directory: docs/commercial/lds-customer-renewal-expansion
        run: python3 -m unittest -v test_renewal_expansion.py
