name: VL Adapter Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-adapter-readiness.yml'

permissions:
  contents: read

jobs:
  vercel-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel credential is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN_MISSING'; exit 1; }
          echo 'VERCEL_TOKEN_PRESENT'

      - name: Verify read-only Vercel project access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ek0PFcc5mJpTOnL6xL7lgVQDWLpg
          VERCEL_TEAM_ID: team_tV4WIIVgvU5VybM7PIhiuVNO
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" \
            -o project.json
          python3 - <<'PY'
          import json
          d=json.load(open('project.json'))
          assert d.get('id')=='prj_ek0PFcc5mJpTOnL6xL7lgVQDWLpg', 'unexpected Vercel project id'
          assert d.get('name')=='fieldgis-reference', 'unexpected Vercel project name'
          print('VERCEL_READ_ACCESS_PASS')
          PY

  supabase-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Supabase management credential is configured
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN_MISSING'; exit 1; }
          echo 'SUPABASE_ACCESS_TOKEN_PRESENT'

      - name: Verify scoped Supabase production project access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zetqezdvupdlrzrlqddq
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}" \
            -o project.json
          python3 - <<'PY'
          import json
          d=json.load(open('project.json'))
          assert d.get('ref')=='zetqezdvupdlrzrlqddq', 'unexpected Supabase project ref'
          assert d.get('name')=='vl-api-production', 'unexpected Supabase project name'
          print('SUPABASE_SCOPED_PROJECT_READ_ACCESS_PASS')
          PY

      - name: Verify scoped Supabase API-key read access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: zetqezdvupdlrzrlqddq
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            -o api-keys.json
          python3 - <<'PY'
          import json
          d=json.load(open('api-keys.json'))
          items=d if isinstance(d,list) else d.get('keys',[])
          assert isinstance(items,list) and items, 'no API keys returned'
          anon=[x for x in items if str(x.get('name') or x.get('type') or '').lower()=='anon']
          assert anon, 'legacy anon key unavailable'
          print('SUPABASE_API_KEY_READ_ACCESS_PASS')
          PY

      - name: Verify Supabase smoke JWT secret
        shell: bash
        env:
          SUPABASE_FUNCTION_SMOKE_JWT: ${{ secrets.SUPABASE_FUNCTION_SMOKE_JWT }}
          SUPABASE_PROJECT_REF: zetqezdvupdlrzrlqddq
        run: |
          set -euo pipefail
          test -n "${SUPABASE_FUNCTION_SMOKE_JWT:-}" || { echo 'SUPABASE_FUNCTION_SMOKE_JWT_MISSING'; exit 1; }
          python3 - <<'PY'
          import os, json, base64, time
          token=os.environ['SUPABASE_FUNCTION_SMOKE_JWT']
          parts=token.split('.')
          assert len(parts)==3, 'smoke credential is not a JWT'
          payload=parts[1] + '=' * (-len(parts[1]) % 4)
          claims=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          assert claims.get('ref')==os.environ['SUPABASE_PROJECT_REF'], 'smoke JWT project ref mismatch'
          assert claims.get('role')=='anon', 'smoke JWT role is not anon'
          exp=claims.get('exp')
          assert isinstance(exp,(int,float)) and exp > time.time(), 'smoke JWT expired'
          print('SUPABASE_SMOKE_JWT_CONTRACT_PASS')
          PY
