name: LUNDUS DIGITAL SYSTEMS Integration Readiness Matrix
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-integration-readiness/**'
      - '.github/workflows/lds-integration-readiness.yml'
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-integration-readiness/check_matrix.py
