name: LOM Level 6 Exact-Main Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'vl/lom-6-*/**'
      - 'vl/lom-canonical-compliance/**'
      - 'vl/lom-final-hardening/**'
      - '.github/workflows/lom-level6-exact-main-regression.yml'
      - '.github/workflows/lom-master-compliance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level6-exact-main-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run every required LOM 6.x functional regression suite on this exact SHA
        run: python vl/lom-final-hardening/run_level6_exact_main.py
