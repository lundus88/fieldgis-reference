name: VL OIDC Debug

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-oidc-debug.yml'

permissions:
  contents: read
  id-token: write

jobs:
  debug-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Decode safe OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-factory-runner")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RAW")
          python3 - "$TOKEN" <<'PY'
          import base64,json,sys
          token=sys.argv[1]
          p=token.split('.')[1]
          p += '=' * ((4-len(p)%4)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          safe={k:c.get(k) for k in ['iss','aud','repository','repository_id','ref','workflow','workflow_ref','job_workflow_ref','run_id','event_name']}
          print(json.dumps(safe,indent=2))
          PY
