name: LOM 6.3 Telemetry Collection Pilot

on:
  pull_request:
    paths:
      - 'vl/lom-6-3-telemetry-collection-pilot/**'
      - '.github/workflows/lom-6-3-telemetry-collection-pilot.yml'
  push:
    branches:
      - lom-6-3-telemetry-collection-pilot
    paths:
      - 'vl/lom-6-3-telemetry-collection-pilot/**'
      - '.github/workflows/lom-6-3-telemetry-collection-pilot.yml'

permissions:
  contents: read

jobs:
  lom-6-3-telemetry-collection-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run LOM 6.3 collector regression suite
        working-directory: vl/lom-6-3-telemetry-collection-pilot
        run: python -m unittest -v test_collector.py
