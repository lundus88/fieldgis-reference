name: LUNDUS DIGITAL SYSTEMS System Blueprint
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-system-blueprint/**'
      - '.github/workflows/lds-system-blueprint.yml'
permissions:
  contents: read
jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-system-blueprint/check_blueprint.py
      - working-directory: docs/commercial/lds-system-blueprint
        run: python3 -m unittest -v test_blueprint_engine.py
