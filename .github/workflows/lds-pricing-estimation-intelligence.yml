name: LUNDUS DIGITAL SYSTEMS Pricing Estimation Intelligence
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-pricing-estimation-intelligence/**'
      - '.github/workflows/lds-pricing-estimation-intelligence.yml'
permissions:
  contents: read
jobs:
  pricing-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-pricing-estimation-intelligence/check_pricing_estimation.py
      - working-directory: docs/commercial/lds-pricing-estimation-intelligence
        run: python3 -m unittest -v test_pricing_estimation.py
