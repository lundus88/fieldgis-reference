name: VL Desktop Tauri Signing Graduation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-desktop-tauri-signing-graduation.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check production signing credential presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in \
            WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [ -z "${!v:-}" ]; then
              echo "MISSING:$v"
              missing=1
            else
              echo "PRESENT:$v"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production signing graduation remains BLOCKED. No secrets were printed."
            exit 1
          fi

      - name: Mark readiness only
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## VL Desktop Tauri signing graduation
          Credential presence check: PASS.

          This job proves readiness only. It does not certify Windows Authenticode, Apple Developer ID signing/notarization, or Tauri updater signatures. Those require the platform-specific signing jobs and post-signature verification to pass.
          EOF
