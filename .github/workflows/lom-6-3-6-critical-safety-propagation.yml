name: LOM 6.3.6 Critical Safety Propagation

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-6-3-6-critical-safety-propagation/**'
      - 'vl/lom-canonical-compliance/**'
      - '.github/workflows/lom-6-3-6-critical-safety-propagation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-safety-propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run LOM 6.3.6 regression suite
        working-directory: vl/lom-6-3-6-critical-safety-propagation
        run: python -m unittest -v test_artifact_v2.py
      - name: Validate canonical LOM chain
        run: python vl/lom-canonical-compliance/validate_canonical_chain.py
