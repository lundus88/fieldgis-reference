name: VL Commercial Fulfillment Receipt Close

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/migrations/20260918_commercial_fulfillment_receipt_close.sql'
      - 'vl/tests/check_commercial_fulfillment_receipt_close.py'
      - 'docs/commercial/COMMERCIAL_FULFILLMENT_RECEIPT_CLOSE_RC.md'
      - '.github/workflows/vl-commercial-fulfillment-receipt-close.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fulfillment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate commercial fulfilment fail-closed contract
        run: python3 vl/tests/check_commercial_fulfillment_receipt_close.py
