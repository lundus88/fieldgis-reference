name: LUNDUS DIGITAL SYSTEMS Change Request Scope Ledger

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-change-request-scope-ledger/**'
      - '.github/workflows/lds-change-request-scope-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commercial/lds-change-request-scope-ledger/**'
      - '.github/workflows/lds-change-request-scope-ledger.yml'

permissions:
  contents: read

jobs:
  change-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate scope ledger
        run: python3 docs/commercial/lds-change-request-scope-ledger/check_scope_ledger.py
      - name: Run scope-change tests
        working-directory: docs/commercial/lds-change-request-scope-ledger
        run: python3 -m unittest -v test_change_request_engine.py
