name: LOM 2.0 Gate D Remediation

on:
  pull_request:
    paths:
      - 'vl/lom-gate-d-remediation/**'
      - '.github/workflows/lom-2-gate-d-remediation.yml'
  push:
    branches:
      - lom-2-gate-d-remediation
    paths:
      - 'vl/lom-gate-d-remediation/**'
      - '.github/workflows/lom-2-gate-d-remediation.yml'

jobs:
  remediation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate remediation policy
        run: python vl/lom-gate-d-remediation/validate_remediation.py
      - name: Run remediation regression tests
        working-directory: vl/lom-gate-d-remediation
        run: python -m pytest -q
