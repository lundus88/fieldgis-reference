name: LOM P6 Live Opportunity Register

on:
  pull_request:
    paths:
      - 'vl/lom-revenue-execution/**'
      - '.github/workflows/lom-p6-live-opportunity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python vl/lom-revenue-execution/evaluate_live_register.py
      - run: python -m unittest vl/lom-revenue-execution/test_live_register.py
