name: VL Production Promoter

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-production-promoter.yml'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: vl-production-promoter
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Get promotion OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-production-promoter")
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RAW")
          echo "::add-mask::$TOKEN"
          echo "VRS_PROMOTION_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Claim promotion job
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_PROMOTION_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-promotion-oidc' \
            -d '{"action":"claim"}' > claim.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('claim.json'))
          print(json.dumps({k:d.get(k) for k in ('status','target_adapter','job_id','deployment_id','factory_run_id')},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k in ('status','target_adapter','job_id','lease_token','deployment_id','factory_run_id','source_artifact_name','source_github_run_id','expected_sha256'):
                  f.write(f"{k}={d.get(k,'')}\n")
          PY

      - name: No promotion work
        if: steps.claim.outputs.status != 'leased'
        run: echo "No approved production promotion job available."

      - name: Download immutable source artifact
        if: steps.claim.outputs.status == 'leased'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.claim.outputs.source_artifact_name }}
          path: promoted-source
          repository: lundus88/fieldgis-reference
          run-id: ${{ steps.claim.outputs.source_github_run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable source hash
        id: source_verify
        if: steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(find promoted-source -type f | head -n 1)
          test -n "$FILE"
          ACTUAL=$(sha256sum "$FILE" | awk '{print $1}')
          EXPECTED='${{ steps.claim.outputs.expected_sha256 }}'
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha=$ACTUAL" >> "$GITHUB_OUTPUT"

      # ---------- Mobile immutable release artifact ----------
      - name: Prepare mobile production artifact
        id: mobile_prepare
        if: steps.claim.outputs.target_adapter == 'mobile-release-artifact' && steps.source_verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "name=vl-production-${{ steps.claim.outputs.deployment_id }}-android" >> "$GITHUB_OUTPUT"

      - name: Publish immutable mobile production artifact
        id: mobile_publish
        if: steps.mobile_prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mobile_prepare.outputs.name }}
          path: ${{ steps.source_verify.outputs.file }}
          if-no-files-found: error
          retention-days: 90

      # ---------- Vercel prebuilt production adapters ----------
      - name: Prepare immutable Vercel Build Output
        id: vercel_prepare
        if: (steps.claim.outputs.target_adapter == 'vercel-production' || steps.claim.outputs.target_adapter == 'vercel-pwa-production' || steps.claim.outputs.target_adapter == 'vercel-gis-production') && steps.source_verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'VERCEL_TOKEN is not configured in GitHub Actions'; exit 1; }
          rm -rf vercel-prebuilt
          mkdir -p vercel-prebuilt
          tar -xzf '${{ steps.source_verify.outputs.file }}' -C vercel-prebuilt
          test -s vercel-prebuilt/.vercel/output/config.json
          test -n "$(find vercel-prebuilt/.vercel/output/static -type f -print -quit)"
          python3 - <<'PY'
          import json,pathlib,os
          d=json.load(open('claim.json'))
          cfg=d.get('adapter_configuration') or {}
          disc=cfg.get('discovery') or {}
          project_id=str(disc.get('project_id') or '')
          team_id=str(disc.get('team_id') or '')
          if not project_id or not team_id:
              raise SystemExit('Vercel project/team mapping missing from adapter registry')
          p=pathlib.Path('vercel-prebuilt/.vercel/project.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({'projectId':project_id,'orgId':team_id}))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'VERCEL_PROJECT_ID={project_id}\n')
              f.write(f'VERCEL_ORG_ID={team_id}\n')
          PY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy immutable Vercel output to production
        id: vercel_deploy
        if: steps.vercel_prepare.outcome == 'success'
        working-directory: vercel-prebuilt
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@59.5.0
          URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')
          test -n "$URL"
          case "$URL" in https://*) ;; *) echo "Unexpected Vercel deployment output: $URL"; exit 1 ;; esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify Vercel production deployment
        id: vercel_verify
        if: steps.vercel_deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.vercel_deploy.outputs.url }}'
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/vl-vercel-index "$URL/"
          test -s /tmp/vl-vercel-index
          ADAPTER='${{ steps.claim.outputs.target_adapter }}'
          if [ "$ADAPTER" = 'vercel-pwa-production' ]; then
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/vl-manifest "$URL/manifest.webmanifest"
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/vl-sw "$URL/sw.js"
            test -s /tmp/vl-manifest
            test -s /tmp/vl-sw
          fi
          echo "provider_url=$URL" >> "$GITHUB_OUTPUT"

      # ---------- Supabase Edge Function production adapter ----------
      - name: Prepare immutable Supabase Edge Function source
        id: supabase_prepare
        if: steps.claim.outputs.target_adapter == 'supabase-edge-function' && steps.source_verify.outcome == 'success'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_FUNCTION_SMOKE_JWT: ${{ secrets.SUPABASE_FUNCTION_SMOKE_JWT }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions'; exit 1; }
          test -n "${SUPABASE_FUNCTION_SMOKE_JWT:-}" || { echo 'SUPABASE_FUNCTION_SMOKE_JWT is not configured in GitHub Actions'; exit 1; }
          rm -rf supabase-prebuilt
          mkdir -p supabase-prebuilt/source supabase-prebuilt/supabase/functions
          tar -xzf '${{ steps.source_verify.outputs.file }}' -C supabase-prebuilt/source
          test -s supabase-prebuilt/source/index.ts
          python3 - <<'PY'
          import json,pathlib,os,re
          d=json.load(open('claim.json'))
          cfg=d.get('adapter_configuration') or {}
          target=cfg.get('target') or {}
          project_ref=str(target.get('project_ref') or '')
          function_name=str(target.get('function_name') or '')
          verify_jwt=target.get('verify_jwt',True)
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,62}',function_name):
              raise SystemExit('Supabase production function name missing or invalid')
          if not re.fullmatch(r'[a-z]{20}',project_ref):
              raise SystemExit('Supabase production project ref missing or invalid')
          if verify_jwt is not True:
              raise SystemExit('VL API production adapter requires verify_jwt=true')
          dst=pathlib.Path('supabase-prebuilt/supabase/functions')/function_name
          dst.mkdir(parents=True,exist_ok=True)
          for src in pathlib.Path('supabase-prebuilt/source').iterdir():
              if src.is_file():
                  (dst/src.name).write_bytes(src.read_bytes())
          pathlib.Path('supabase-prebuilt/supabase/config.toml').write_text(f'[functions.{function_name}]\nverify_jwt = true\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'SUPABASE_PROD_PROJECT_REF={project_ref}\n')
              f.write(f'SUPABASE_PROD_FUNCTION_NAME={function_name}\n')
              f.write(f'SUPABASE_PROD_URL=https://{project_ref}.supabase.co/functions/v1/{function_name}\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'project_ref={project_ref}\n')
              f.write(f'function_name={function_name}\n')
              f.write(f'provider_url=https://{project_ref}.supabase.co/functions/v1/{function_name}\n')
          PY

      - name: Set up pinned Supabase CLI
        if: steps.supabase_prepare.outcome == 'success'
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Deploy immutable Supabase Edge Function source
        id: supabase_deploy
        if: steps.supabase_prepare.outcome == 'success'
        working-directory: supabase-prebuilt
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy "$SUPABASE_PROD_FUNCTION_NAME" --project-ref "$SUPABASE_PROD_PROJECT_REF"
          echo "provider_url=$SUPABASE_PROD_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Supabase production function
        id: supabase_verify
        if: steps.supabase_deploy.outcome == 'success'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_FUNCTION_SMOKE_JWT: ${{ secrets.SUPABASE_FUNCTION_SMOKE_JWT }}
        run: |
          set -euo pipefail
          # Verify provider metadata and JWT enforcement first.
          curl -fsS \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROD_PROJECT_REF}/functions/${SUPABASE_PROD_FUNCTION_NAME}" \
            -o /tmp/function.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/function.json'))
          status=str(d.get('status') or '').upper()
          if status not in ('ACTIVE','READY'):
              raise SystemExit(f'production Edge Function not active: {status}')
          if d.get('verify_jwt') is not True:
              raise SystemExit('production Edge Function verify_jwt is not true')
          PY
          CODE=$(curl -sS -o /tmp/unauth-body -w '%{http_code}' "$SUPABASE_PROD_URL")
          test "$CODE" = '401'
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer ${SUPABASE_FUNCTION_SMOKE_JWT}" \
            -H "apikey: ${SUPABASE_FUNCTION_SMOKE_JWT}" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$SUPABASE_PROD_URL" -o /tmp/auth-body
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/auth-body'))
          if not isinstance(d,dict): raise SystemExit('unexpected function response')
          if d.get('ok') is not True: raise SystemExit('function response contract did not return ok=true')
          PY
          echo "provider_url=$SUPABASE_PROD_URL" >> "$GITHUB_OUTPUT"

      # ---------- Fail-closed callback ----------
      - name: Callback VL promotion
        if: always() && steps.claim.outputs.status == 'leased'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > callback.json
          import json
          d=json.load(open('claim.json'))
          adapter=d.get('target_adapter')
          source_ok='${{ steps.source_verify.outcome }}'=='success'
          result={
            'runner':'github-actions-oidc',
            'promotion_adapter':adapter,
            'github_run_id':'${{ github.run_id }}',
            'github_sha':'${{ github.sha }}',
            'artifact_sha256':'${{ steps.source_verify.outputs.sha }}',
            'immutable_no_rebuild':True,
          }
          checks=[]
          ok=False
          error='Production promotion failed closed'
          if adapter=='mobile-release-artifact':
              publish_ok='${{ steps.mobile_publish.outcome }}'=='success'
              ok=source_ok and publish_ok
              if ok:
                  result['artifact_name']='${{ steps.mobile_prepare.outputs.name }}'
                  result['post_deploy_verification']='PASS'
                  checks=[
                    {'check_key':'immutable_source_sha256','status':'pass','expected':d.get('expected_sha256'),'actual':'${{ steps.source_verify.outputs.sha }}','evidence':{'source':'github-actions-artifact'}},
                    {'check_key':'production_release_artifact','status':'pass','expected':'published','actual':'published','evidence':{'artifact_name':'${{ steps.mobile_prepare.outputs.name }}'}},
                  ]
                  result['verification_checks']=checks
                  error=None
              else:
                  error='Mobile immutable artifact publication or SHA verification failed'
          elif adapter in ('vercel-production','vercel-pwa-production','vercel-gis-production'):
              deploy_ok='${{ steps.vercel_deploy.outcome }}'=='success'
              verify_ok='${{ steps.vercel_verify.outcome }}'=='success'
              ok=source_ok and deploy_ok and verify_ok
              if ok:
                  url='${{ steps.vercel_verify.outputs.provider_url }}'
                  result['provider_url']=url
                  result['provider_deployment_id']=url
                  result['post_deploy_verification']='PASS'
                  checks=[
                    {'check_key':'immutable_source_sha256','status':'pass','expected':d.get('expected_sha256'),'actual':'${{ steps.source_verify.outputs.sha }}','evidence':{'source':'github-actions-artifact'}},
                    {'check_key':'vercel_build_output_contract','status':'pass','expected':'v3 prebuilt','actual':'v3 prebuilt','evidence':{'immutable_no_rebuild':True}},
                    {'check_key':'production_http','status':'pass','expected':'reachable','actual':'reachable','evidence':{'provider_url':url}},
                  ]
                  if adapter=='vercel-pwa-production':
                      checks.append({'check_key':'pwa_runtime_assets','status':'pass','expected':'manifest+service-worker','actual':'manifest+service-worker','evidence':{'provider_url':url}})
                  result['verification_checks']=checks
                  error=None
              else:
                  error='Vercel prebuilt deployment, immutable SHA verification, or post-deploy HTTP verification failed'
          elif adapter=='supabase-edge-function':
              deploy_ok='${{ steps.supabase_deploy.outcome }}'=='success'
              verify_ok='${{ steps.supabase_verify.outcome }}'=='success'
              ok=source_ok and deploy_ok and verify_ok
              if ok:
                  url='${{ steps.supabase_verify.outputs.provider_url }}'
                  result['provider_url']=url
                  result['provider_deployment_id']=url
                  result['post_deploy_verification']='PASS'
                  checks=[
                    {'check_key':'immutable_source_sha256','status':'pass','expected':d.get('expected_sha256'),'actual':'${{ steps.source_verify.outputs.sha }}','evidence':{'source':'github-actions-artifact'}},
                    {'check_key':'supabase_function_active','status':'pass','expected':'ACTIVE','actual':'ACTIVE','evidence':{'provider_url':url}},
                    {'check_key':'jwt_contract','status':'pass','expected':'unauthorized_without_jwt','actual':'401','evidence':{'verify_jwt':True}},
                    {'check_key':'response_contract','status':'pass','expected':'ok=true','actual':'ok=true','evidence':{'authenticated_smoke':True}},
                  ]
                  result['verification_checks']=checks
                  error=None
              else:
                  error='Supabase Edge Function deployment, JWT enforcement, or authenticated smoke verification failed'
          else:
              ok=False
              error=f'Unsupported promotion adapter: {adapter}'
          print(json.dumps({'action':'complete','job_id':d['job_id'],'lease_token':d['lease_token'],'success':ok,'result':result,'error_text':error}))
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${VRS_PROMOTION_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vrs-promotion-oidc' \
            --data-binary @callback.json | tee callback-response.json
