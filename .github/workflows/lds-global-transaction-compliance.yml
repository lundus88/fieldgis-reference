name: LUNDUS DIGITAL SYSTEMS Global Transaction Compliance
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-global-transaction-compliance/**'
      - '.github/workflows/lds-global-transaction-compliance.yml'
permissions:
  contents: read
jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-global-transaction-compliance/check.py
      - working-directory: docs/commercial/lds-global-transaction-compliance
        run: python3 -m unittest -v test_engine.py
