name: LUNDUS DIGITAL SYSTEMS Legal Trust Closing Pack
on:
  pull_request:
    paths:
      - 'commercial/lundus-digital-systems/**'
      - 'docs/commercial/LDS_LEGAL_TRUST_CLOSING_PACK.json'
      - 'docs/commercial/LDS_LEGAL_TRUST_FINAL_APPROVAL.json'
      - 'docs/commercial/LDS_PUBLIC_CONTACT_SEPARATION_POLICY.json'
      - 'docs/commercial/LDS_PUBLIC_CONTACT_PROVISIONING_PLAN.json'
      - 'docs/commercial/LDS_PUBLIC_CONTACT_DUE_DILIGENCE_2026-09-21.json'
      - '.github/workflows/lds-legal-trust-closing.yml'
permissions:
  contents: read
jobs:
  legal-trust-closing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 commercial/lundus-digital-systems/check_legal_trust_closing.py
      - run: python3 commercial/lundus-digital-systems/check_commercial_surface.py
      - run: python3 commercial/lundus-digital-systems/check_surface_qa.py
