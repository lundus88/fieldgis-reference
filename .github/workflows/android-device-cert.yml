name: Build Android Device Cert APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-device-cert.yml'

permissions:
  contents: read

jobs:
  device-cert-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.38.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Generate clean Android scaffold
        run: flutter create . --platforms=android --org com.vrslabs.devicecert --project-name fieldgis_reference

      - name: Configure device-cert app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>'''
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace(marker,perms)
          s=s.replace('android:label="fieldgis_reference"','android:label="FieldGIS Device Cert"')
          p.write_text(s)
          PY

      - name: Rewrite generated smoke test
        run: |
          cat > test/widget_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:fieldgis_reference/main.dart';

          void main() {
            test('FieldPoint JSON roundtrip', () {
              final createdAt = DateTime.utc(2026, 8, 25, 12, 0);
              final point = FieldPoint(
                id: 'device-cert-point',
                code: 'DC001',
                latitude: 5.9804,
                longitude: 116.0735,
                accuracyM: 3.0,
                createdAt: createdAt,
              );
              final restored = FieldPoint.fromJson(point.toJson());
              expect(restored.id, point.id);
              expect(restored.code, point.code);
              expect(restored.latitude, point.latitude);
              expect(restored.longitude, point.longitude);
              expect(restored.accuracyM, point.accuracyM);
              expect(restored.createdAt, point.createdAt);
            });
          }
          DART

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload ARM64 device-cert artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldgis-device-cert-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
