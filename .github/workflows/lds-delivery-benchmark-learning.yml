name: LUNDUS DIGITAL SYSTEMS Delivery Benchmark Learning
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-delivery-benchmark-learning/**'
      - '.github/workflows/lds-delivery-benchmark-learning.yml'
permissions:
  contents: read
jobs:
  delivery-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-delivery-benchmark-learning/check_delivery_benchmark.py
      - working-directory: docs/commercial/lds-delivery-benchmark-learning
        run: python3 -m unittest -v test_delivery_benchmark.py
