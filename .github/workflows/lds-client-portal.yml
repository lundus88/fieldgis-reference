name: LUNDUS DIGITAL SYSTEMS Client Portal

on:
  pull_request:
    paths:
      - 'commercial/lundus-digital-systems/client-portal*'
      - 'commercial/lundus-digital-systems/client_portal_state.py'
      - 'commercial/lundus-digital-systems/test_client_portal_state.py'
      - 'commercial/lundus-digital-systems/CLIENT_PORTAL_V1.md'
      - 'commercial/lundus-digital-systems/check_client_portal.py'
      - 'commercial/lundus-digital-systems/customer_action_gateway.py'
      - 'commercial/lundus-digital-systems/customer-action-gateway-contract.json'
      - 'commercial/lundus-digital-systems/test_customer_action_gateway.py'
      - 'commercial/lundus-digital-systems/CUSTOMER_ACTION_GATEWAY_P2.md'
      - '.github/workflows/lds-client-portal.yml'
  push:
    branches: [main]
    paths:
      - 'commercial/lundus-digital-systems/client-portal*'
      - 'commercial/lundus-digital-systems/client_portal_state.py'
      - 'commercial/lundus-digital-systems/test_client_portal_state.py'
      - 'commercial/lundus-digital-systems/CLIENT_PORTAL_V1.md'
      - 'commercial/lundus-digital-systems/check_client_portal.py'
      - 'commercial/lundus-digital-systems/customer_action_gateway.py'
      - 'commercial/lundus-digital-systems/customer-action-gateway-contract.json'
      - 'commercial/lundus-digital-systems/test_customer_action_gateway.py'
      - 'commercial/lundus-digital-systems/CUSTOMER_ACTION_GATEWAY_P2.md'
      - '.github/workflows/lds-client-portal.yml'

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate client portal contract
        run: python3 commercial/lundus-digital-systems/check_client_portal.py
      - name: Run portal state tests
        working-directory: commercial/lundus-digital-systems
        run: python3 -m unittest -v test_client_portal_state.py
      - name: Run customer action gateway P2 tests
        working-directory: commercial/lundus-digital-systems
        run: python3 -m unittest -v test_customer_action_gateway.py
