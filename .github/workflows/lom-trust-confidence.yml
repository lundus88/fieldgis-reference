name: LOM Trust & Confidence Calibration

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/lom-learning-evaluation/**'
      - '.github/workflows/lom-trust-confidence.yml'
  push:
    branches: [main]
    paths:
      - 'vl/lom-learning-evaluation/**'
      - '.github/workflows/lom-trust-confidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: LOM 4.2 learning and trust regression
        working-directory: vl/lom-learning-evaluation
        run: python -m unittest -v test_learning_core.py test_trust_confidence.py
      - name: Emit calibrated trust evidence
        working-directory: vl/lom-learning-evaluation
        run: |
          python trust_confidence.py > /tmp/lom-trust-confidence.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/lom-trust-confidence.json'))
          assert result['disposition'] == 'TRUSTED', result
          assert result['production_locked'] is True, result
          assert result['execution_authority'] == 'NONE', result
          assert result['autonomous_ceiling'] == 'PREPARE_PR', result
          assert result['authority_effect'] == 'NONE', result
          assert result['calibration']['status'] == 'READY', result
          PY
