name: LOM P6 Revenue Execution

on:
  pull_request:
    paths:
      - 'vl/lom-revenue-execution/**'
      - '.github/workflows/lom-p6-revenue-execution.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m json.tool vl/lom-revenue-execution/revenue-policy.json
      - run: cd vl/lom-revenue-execution && python -m unittest test_revenue_execution.py
