name: VL Mobile Sandbox Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'vl/scripts/prepare-mobile-flutter-cache.sh'
      - 'vl/scripts/build-mobile-flutter-sandbox.sh'
      - '.github/workflows/vl-factory-runner.yml'
      - '.github/workflows/vl-mobile-sandbox-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-sandbox-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VRS_OIDC_TOKEN: host-secret-must-not-leak
      SUPABASE_SERVICE_ROLE_KEY: host-secret-must-not-leak
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: host-secret-must-not-leak
      ACTIONS_ID_TOKEN_REQUEST_URL: https://example.invalid/oidc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Flutter template tool
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Create pristine trusted Android template
        shell: bash
        run: |
          set -euo pipefail
          flutter create sandbox-mobile --platforms=android --org com.vrslabs --project-name vl_sandbox_probe
          rm -f sandbox-mobile/test/widget_test.dart
          chmod +x vl/scripts/prepare-mobile-flutter-cache.sh vl/scripts/build-mobile-flutter-sandbox.sh
          vl/scripts/prepare-mobile-flutter-cache.sh sandbox-mobile
          test -f sandbox-mobile/.vl-mobile-cache-prepared
          test -x sandbox-mobile/.flutter-sdk/bin/flutter
          test -s sandbox-mobile/.flutter-sdk/bin/cache/engine.stamp
          test -s sandbox-mobile/.android-sdk-components/ndk/28.2.13676358/source.properties
          test -x sandbox-mobile/.android-sdk-components/build-tools/35.0.0/aapt2
          test -s sandbox-mobile/.android-sdk-components/platforms/android-36/android.jar
          test -x sandbox-mobile/.android-sdk-components/cmake/3.22.1/bin/cmake

      - name: Inject generated-code adversarial Gradle probe after cache preparation
        shell: bash
        run: |
          set -euo pipefail
          cat >> sandbox-mobile/android/app/build.gradle.kts <<'KOTLIN'

          val vlSandboxProbe = tasks.register("vlSandboxProbe") {
              doLast {
                  val sensitive = listOf(
                      "VRS_OIDC_TOKEN",
                      "SUPABASE_SERVICE_ROLE_KEY",
                      "ACTIONS_ID_TOKEN_REQUEST_TOKEN",
                      "ACTIONS_ID_TOKEN_REQUEST_URL"
                  )
                  val leaked = sensitive.any { !System.getenv(it).isNullOrEmpty() }
                  val dockerSocket = rootProject.file("/var/run/docker.sock").exists()

                  var network = false
                  try {
                      val conn = project.uri("https://example.com").toURL().openConnection()
                      conn.connectTimeout = 1000
                      conn.readTimeout = 1000
                      conn.getInputStream().use { stream -> stream.read() }
                      network = true
                  } catch (_: Exception) {
                      network = false
                  }

                  var outsideWrite = false
                  try {
                      rootProject.file("/etc/vl-mobile-sandbox-probe").writeText("should-not-write")
                      outsideWrite = true
                  } catch (_: Exception) {
                      outsideWrite = false
                  }

                  val json = "{\"leaked\":" + leaked +
                      ",\"network\":" + network +
                      ",\"docker_socket\":" + dockerSocket +
                      ",\"outside_write\":" + outsideWrite + "}"
                  rootProject.projectDir.parentFile.resolve(".vl-mobile-sandbox-env.json").writeText(json)
              }
          }

          tasks.matching { it.name == "preBuild" }.configureEach {
              dependsOn(vlSandboxProbe)
          }
          KOTLIN

      - name: Analyze and build generated Mobile code offline in sandbox
        shell: bash
        run: |
          set -euo pipefail
          vl/scripts/build-mobile-flutter-sandbox.sh sandbox-mobile mobile-flutter-v1 > mobile-sha256.txt

      - name: Assert Mobile sandbox isolation and artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s sandbox-mobile/.vl-mobile-sandbox-env.json
          test -s sandbox-mobile/build/app/outputs/flutter-apk/app-debug.apk
          grep -q 'app-debug.apk' mobile-sha256.txt
          python3 - <<'PY'
          import json
          d=json.load(open('sandbox-mobile/.vl-mobile-sandbox-env.json'))
          expected={
              'leaked': False,
              'network': False,
              'docker_socket': False,
              'outside_write': False,
          }
          assert d == expected, (d, expected)
          print('VL MOBILE SANDBOX REGRESSION: PASS')
          PY

      - name: Assert sandbox contract is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--user "${HOST_UID}:${HOST_GID}"' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--network none' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--cap-drop ALL' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- 'no-new-privileges:true' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--pids-limit' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--memory' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--cpus' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '/workspace/.flutter-sdk/bin/flutter' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '.android-sdk-components/ndk,dst=/opt/android-sdk-linux/ndk,readonly' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '.android-sdk-components/build-tools,dst=/opt/android-sdk-linux/build-tools,readonly' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '.android-sdk-components/platforms,dst=/opt/android-sdk-linux/platforms,readonly' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '.android-sdk-components/cmake,dst=/opt/android-sdk-linux/cmake,readonly' vl/scripts/build-mobile-flutter-sandbox.sh
          grep -q -- '--network none' vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- '--read-only' vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "NDK_VERSION='28.2.13676358'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "BUILD_TOOLS_VERSION='35.0.0'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "COMPILE_SDK='36'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "CMAKE_VERSION='3.22.1'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "'build-tools;\$BUILD_TOOLS_VERSION'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "'platforms;android-\$COMPILE_SDK'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- "'cmake;\$CMAKE_VERSION'" vl/scripts/prepare-mobile-flutter-cache.sh
          grep -q -- '/workspace/.flutter-sdk/bin/flutter' vl/scripts/prepare-mobile-flutter-cache.sh
          ! grep -q -- '/sdks/flutter/bin/flutter' vl/scripts/build-mobile-flutter-sandbox.sh

          # The live Factory Runner must prepare trusted state before overlaying
          # generated artifacts and must execute Mobile build logic only via the
          # credential-free offline sandbox wrapper.
          grep -q -- 'Prepare pristine Android workspace and trusted cache' .github/workflows/vl-factory-runner.yml
          grep -q -- 'vl/scripts/prepare-mobile-flutter-cache.sh workspace/mobile' .github/workflows/vl-factory-runner.yml
          grep -q -- 'Overlay generated Mobile artifacts' .github/workflows/vl-factory-runner.yml
          grep -q -- "reserved_marker=(root/'.vl-mobile-cache-prepared').resolve()" .github/workflows/vl-factory-runner.yml
          grep -q -- 'reserved_dirs=tuple((root/name).resolve()' .github/workflows/vl-factory-runner.yml
          grep -q -- 'any(target==r or r in target.parents for r in reserved_dirs)' .github/workflows/vl-factory-runner.yml
          grep -q -- 'reserved mobile artifact path' .github/workflows/vl-factory-runner.yml
          grep -q -- 'Build Android artifact in generated-code sandbox' .github/workflows/vl-factory-runner.yml
          grep -q -- '../../vl/scripts/build-mobile-flutter-sandbox.sh' .github/workflows/vl-factory-runner.yml
          ! grep -q -- 'flutter pub get 2>&1 | tee ../../runner-mobile.log' .github/workflows/vl-factory-runner.yml
          ! grep -q -- 'flutter analyze --no-fatal-infos 2>&1 | tee -a ../../runner-mobile.log' .github/workflows/vl-factory-runner.yml
          ! grep -q -- 'flutter build apk --debug 2>&1 | tee -a ../../runner-mobile.log' .github/workflows/vl-factory-runner.yml

      - name: Assert canonical reserved-path traversal cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('sandbox-mobile').resolve()
          marker=(root/'.vl-mobile-cache-prepared').resolve()
          reserved=tuple((root/name).resolve() for name in (
              '.flutter-sdk','.android-sdk-components','.gradle','.home','.pub-cache','build'
          ))
          cases=(
              './.flutter-sdk/bin/flutter',
              'foo/../.flutter-sdk/bin/flutter',
              './.gradle/init.gradle',
              'x/../.android-sdk-components/ndk/28.2.13676358/source.properties',
              'tmp/../build/app/outputs/flutter-apk/app-debug.apk',
              'x/../.vl-mobile-cache-prepared',
          )
          for raw in cases:
              target=(root/raw).resolve()
              blocked=(target==marker or any(target==r or r in target.parents for r in reserved))
              assert blocked, raw
          safe=(root/'lib/main.dart').resolve()
          assert safe!=marker and not any(safe==r or r in safe.parents for r in reserved)
          print('VL MOBILE CANONICAL PATH GUARD: PASS')
          PY
