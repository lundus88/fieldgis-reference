name: VL Resend Sandbox Certification

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Resend test scenario
        required: true
        default: delivered
        type: choice
        options: [delivered, bounced]
  push:
    branches: [vl/golden-transaction-payment-notification]
    paths: [.github/workflows/vl-resend-sandbox-cert.yml]

permissions:
  contents: read
  id-token: write

jobs:
  resend-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Get Resend OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          r=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vrs-resend-sandbox")
          t=$(printf '%s' "$r" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - name: Send controlled Resend test email
        env:
          TOKEN: ${{ steps.oidc.outputs.token }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then scenario="bounced"; else scenario="${INPUT_SCENARIO:-delivered}"; fi
          label="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export scenario label
          body=$(python3 -c 'import json,os;print(json.dumps({"scenario":os.environ["scenario"],"label":os.environ["label"]}))')
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST 'https://wczelfmnqpgzfdszxubl.supabase.co/functions/v1/vl-resend-ci-sandbox' -H "Authorization: Bearer ${TOKEN}" -H 'content-type: application/json' --data "$body")
          cat /tmp/r.json
          test "$code" = 200
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/r.json'))
          assert d['ok'] is True
          assert d['environment']=='sandbox'
          assert d['production_send'] is False
          assert d['scenario'] in ('delivered','bounced')
          assert d['provider_message_id']
          assert d['idempotency_key']
          PY
      - name: Scope guard
        run: echo 'RESEND TEST ADDRESSES ONLY. No production recipient or production promotion.'