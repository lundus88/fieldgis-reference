name: LUNDUS DIGITAL SYSTEMS Global Commerce Readiness

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-global-commerce-readiness/**'
      - '.github/workflows/lds-global-commerce-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commercial/lds-global-commerce-readiness/**'
      - '.github/workflows/lds-global-commerce-readiness.yml'

permissions:
  contents: read

jobs:
  global-commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate global commerce policy
        run: python3 docs/commercial/lds-global-commerce-readiness/check_gate.py
      - name: Run deterministic country-gate tests
        working-directory: docs/commercial/lds-global-commerce-readiness
        run: python3 -m unittest -v test_gate.py
