name: LUNDUS DIGITAL SYSTEMS Customer Disappointment Prevention

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-customer-disappointment-prevention/**'
      - '.github/workflows/lds-customer-disappointment-prevention.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commercial/lds-customer-disappointment-prevention/**'
      - '.github/workflows/lds-customer-disappointment-prevention.yml'

permissions:
  contents: read

jobs:
  customer-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate customer risk register
        run: python3 docs/commercial/lds-customer-disappointment-prevention/check_customer_risk.py
      - name: Run customer risk tests
        working-directory: docs/commercial/lds-customer-disappointment-prevention
        run: python3 -m unittest -v test_customer_risk.py
