name: LUNDUS DIGITAL SYSTEMS Automated Commercial Document Lifecycle

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-commercial-document-lifecycle/**'
      - '.github/workflows/lds-commercial-document-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commercial/lds-commercial-document-lifecycle/**'
      - '.github/workflows/lds-commercial-document-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate lifecycle contract
        run: python3 docs/commercial/lds-commercial-document-lifecycle/check_lifecycle.py
      - name: Run lifecycle tests
        working-directory: docs/commercial/lds-commercial-document-lifecycle
        run: python3 -m unittest -v test_lifecycle.py
