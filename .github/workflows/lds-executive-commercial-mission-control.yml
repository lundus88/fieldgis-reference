name: LUNDUS DIGITAL SYSTEMS Executive Commercial Mission Control
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-executive-commercial-mission-control/**'
      - '.github/workflows/lds-executive-commercial-mission-control.yml'
permissions:
  contents: read
jobs:
  executive-commercial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-executive-commercial-mission-control/check_executive_commercial.py
      - working-directory: docs/commercial/lds-executive-commercial-mission-control
        run: python3 -m unittest -v test_executive_commercial.py
