name: VL Runtime Proof Chain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-runtime-proof-chain.yml'

permissions:
  contents: read
  actions: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch official factory runner and reconciliation sweep
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          START=$(date -u +%s)
          gh workflow run vl-factory-runner.yml --repo lundus88/fieldgis-reference --ref main
          RUN_ID=''
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list --repo lundus88/fieldgis-reference --workflow vl-factory-runner.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq ".[] | select((.createdAt | fromdateiso8601) >= $START) | .databaseId" | head -n1 || true)
            [ -n "$RUN_ID" ] && break
            sleep 2
          done
          test -n "$RUN_ID"
          echo "Factory runner run id: $RUN_ID"
          gh run watch "$RUN_ID" --repo lundus88/fieldgis-reference --exit-status
          gh workflow run vl-artifact-reconcile-sweep.yml --repo lundus88/fieldgis-reference --ref main
