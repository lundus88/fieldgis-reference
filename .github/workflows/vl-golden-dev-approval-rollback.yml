name: VL Golden DEV Approval and Rollback Proof

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact PR/source SHA being approved for DEV
        required: true
        type: string
      approval:
        description: Type APPROVE_DEV exactly
        required: true
        type: string
      rollback_from_sha:
        description: DEV candidate SHA to roll back from
        required: true
        type: string
      rollback_to_sha:
        description: Previously verified DEV SHA to restore
        required: true
        type: string

permissions:
  contents: read

env:
  TARGET_ENVIRONMENT: development

jobs:
  human-dev-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: vl-development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Validate explicit human DEV approval
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPROVAL: ${{ inputs.approval }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$APPROVAL" = APPROVE_DEV
          test "$TARGET_ENVIRONMENT" = development
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$ACTOR" in
            *'[bot]'|*'-bot'|'github-actions')
              echo 'automation actor cannot approve DEV' >&2
              exit 1
              ;;
          esac
          test -n "$ACTOR"
          mkdir -p evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'schema_version':'vl.dev-human-approval/1',
            'status':'APPROVED_DEV_ONLY',
            'actor':os.environ['ACTOR'],
            'event':'workflow_dispatch',
            'source_sha':os.environ['SOURCE_SHA'],
            'target_environment':'development',
            'production_allowed':False,
            'approval_literal':'APPROVE_DEV'
          }
          Path('evidence/dev-human-approval.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - name: Record environment protection boundary
        run: |
          set -euo pipefail
          cat > evidence/environment-boundary.txt <<'EOF'
          This job is bound to GitHub environment: vl-development.
          Workflow evidence alone MUST NOT claim required-reviewer protection.
          PASS-PROTECTED requires separate evidence that the environment has an enforced human reviewer/protection rule.
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl-dev-human-approval-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  dev-rollback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: human-dev-approval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.rollback_to_sha }}
      - name: Verify bounded DEV rollback transition
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FROM_SHA: ${{ inputs.rollback_from_sha }}
          TO_SHA: ${{ inputs.rollback_to_sha }}
        run: |
          set -euo pipefail
          test "$TARGET_ENVIRONMENT" = development
          test "$FROM_SHA" = "$SOURCE_SHA"
          test -n "$TO_SHA"
          test "$TO_SHA" != "$FROM_SHA"
          test "$(git rev-parse HEAD)" = "$TO_SHA"
          mkdir -p evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            'schema_version':'vl.dev-rollback-proof/1',
            'status':'ROLLBACK_TARGET_VERIFIED',
            'from_sha':os.environ['FROM_SHA'],
            'to_sha':os.environ['TO_SHA'],
            'target_environment':'development',
            'production_mutation':False,
            'note':'This proves the exact rollback target is retrievable and SHA-bound. It does not claim a live DEV deployment was mutated.'
          }
          Path('evidence/dev-rollback.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vl-dev-rollback-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 90
