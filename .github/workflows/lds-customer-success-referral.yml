name: LUNDUS DIGITAL SYSTEMS Customer Success Referral
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-customer-success-referral/**'
      - '.github/workflows/lds-customer-success-referral.yml'
permissions:
  contents: read
jobs:
  customer-success:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-customer-success-referral/check_customer_success.py
      - working-directory: docs/commercial/lds-customer-success-referral
        run: python3 -m unittest -v test_customer_success.py
