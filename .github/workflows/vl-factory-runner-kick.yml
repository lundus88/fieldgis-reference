name: VL Factory Runner Kick

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vl-factory-runner-kick.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch official VL Factory Runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run vl-factory-runner.yml --repo lundus88/fieldgis-reference --ref main
