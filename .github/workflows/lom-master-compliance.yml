name: LOM Master Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'vl/LOM_V1.md'
      - 'vl/context-governance/**'
      - 'vl/completion-governance/**'
      - 'vl/model-governance/**'
      - 'vl/execution-governance/**'
      - 'vl/remediation-governance/**'
      - 'vl/multi-agent-governance/**'
      - 'vl/connector-governance/**'
      - 'vl/golden-workflow/**'
      - 'vl/lom-4-evolution/**'
      - 'vl/lom-gate-c-runtime/**'
      - 'vl/lom-gate-d-remediation/**'
      - 'vl/lom-gate-e-orchestrator/**'
      - 'vl/lom-mission-control/**'
      - 'vl/lom-portfolio-runtime/**'
      - 'vl/lom-director-loop/**'
      - 'vl/lom-business-os/**'
      - 'vl/lom-autonomous-org/**'
      - 'vl/lom-controlled-validation/**'
      - 'vl/lom-compliance-audit/**'
      - 'vl/lom-operational-safety/**'
      - 'vl/lom-learning-evaluation/**'
      - 'vl/lom-self-improvement-runtime/**'
      - 'vl/lom-continuous-improvement/**'
      - 'vl/lom-daily-ops-cockpit/**'
      - 'vl/lom-security-hardening/**'
      - 'vl/lom-4-5-interoperability-resource-intelligence/**'
      - 'vl/lom-5-operational-maturity/**'
      - 'vl/lom-6-*/**'
      - 'vl/lom-canonical-compliance/**'
      - 'vl/lom-final-hardening/**'
      - 'vl/lom-governance/**'
      - 'vl/lom-knowledge-foundation/**'
      - '.github/workflows/lom-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate LOM version ladder and authority boundaries
        run: python vl/lom-compliance-audit/validate_lom_compliance.py
      - name: Validate LOM 1.0 context policy
        run: python vl/context-governance/validate_context_policy.py vl/context-governance/default-context-policy.json
      - name: LOM 1.0 context governance regression
        working-directory: vl/context-governance
        run: python -m unittest -v test_lom_context_governance.py
      - name: LOM 1.0 independent completion regression
        working-directory: vl/completion-governance
        run: python -m unittest -v test_lom_independent_validator.py
      - name: LOM 1.0 model governance regression
        working-directory: vl/model-governance
        run: python -m unittest -v test_route_model.py
      - name: LOM 1.0 execution pool governance regression
        working-directory: vl/execution-governance
        run: python -m unittest -v test_lom_execution_pool.py
      - name: LOM 1.0 remediation governance regression
        working-directory: vl/remediation-governance
        run: python -m unittest -v test_remediation_policy.py
      - name: LOM 1.0 multi-agent governance regression
        working-directory: vl/multi-agent-governance
        run: python -m unittest -v test_lom_delegation_policy.py
      - name: LOM 1.0 connector registry validation
        run: python vl/connector-governance/validate_connector_registry.py vl/connector-governance/connector-registry.json
      - name: LOM 1.0 Golden workflow
        run: python vl/golden-workflow/run_golden_workflow.py
      - name: LOM 2.0 bounded autonomy
        working-directory: vl/lom-4-evolution
        run: |
          python -m unittest -v test_lom2_bounded_loop.py test_foundation.py
          python validate_foundation.py
      - name: Install pytest for LOM 2 gates
        run: python -m pip install --disable-pip-version-check pytest
      - name: LOM 2.0 Gate C runtime
        run: pytest -q vl/lom-gate-c-runtime
      - name: LOM 2.0 Gate D remediation
        run: |
          python vl/lom-gate-d-remediation/validate_remediation.py
          pytest -q vl/lom-gate-d-remediation
      - name: LOM 2.0 Gate E orchestrator
        run: pytest -q vl/lom-gate-e-orchestrator
      - name: LOM Capability & Knowledge Registry
        run: |
          python vl/lom-governance/validate_registries.py
          python vl/lom-governance/test_registries.py
      - name: LOM Core Systems Consolidation
        run: |
          python vl/lom-governance/validate_core_systems_consolidation.py
          python vl/lom-governance/test_core_systems_consolidation.py
      - name: LOM Knowledge Authority Retrieval & Complete-Body E2E
        run: |
          python vl/lom-knowledge-foundation/test_retrieval_policy.py
          python vl/lom-knowledge-foundation/test_complete_body_e2e.py
      - name: LOM 2.0 Gate F Mission Control
        working-directory: vl/lom-mission-control
        run: python -m unittest -q
      - name: LOM 3.0 Business OS
        working-directory: vl/lom-business-os
        run: python -m unittest -q
      - name: LOM 4.0 Autonomous Organization
        working-directory: vl/lom-autonomous-org
        run: python -m unittest -q
      - name: LOM 4.0 Controlled Operational Validation
        working-directory: vl/lom-controlled-validation
        run: |
          python validation_harness.py
          python -m unittest -q
      - name: LOM 4.1 Operational Safety Hardening
        working-directory: vl/lom-operational-safety
        run: python -m unittest -v test_operational_safety.py
      - name: LOM 4.2 Learning & Evaluation Layer
        working-directory: vl/lom-learning-evaluation
        run: python -m unittest -v test_learning_core.py
      - name: LOM 4.3 Self-Improvement Runtime + Decision Twin
        working-directory: vl/lom-self-improvement-runtime
        run: python -m unittest -v test_self_improvement_runtime.py test_decision_twin.py
      - name: LOM 4.4 Continuous Improvement Orchestrator
        working-directory: vl/lom-continuous-improvement
        run: python -m unittest -v test_orchestrator.py
      - name: LOM Daily Operations Cockpit
        working-directory: vl/lom-daily-ops-cockpit
        run: python -m unittest -v test_cockpit.py
      - name: LOM Security Authority Alignment
        run: python vl/lom-security-hardening/validate_authority_alignment.py
      - name: LOM 4.5 Interoperability & Resource Intelligence
        working-directory: vl/lom-4-5-interoperability-resource-intelligence
        run: python -m unittest -v test_runtime.py
      - name: LOM 5.0 Operational Maturity
        working-directory: vl/lom-5-operational-maturity
        run: |
          python -m unittest -v test_runtime.py test_multi_project_evidence.py test_evidence_capture.py test_golden_5_final_evidence.py test_golden_6_final_evidence.py test_golden_7_final_evidence.py test_golden_8_final_evidence.py
          python build_longitudinal_summary.py --output /tmp/lom-operational-maturity-summary.json
      - name: LOM Canonical 4.3 through 6.12 Reconciliation
        run: |
          python vl/lom-canonical-compliance/validate_canonical_chain.py
          python -m unittest -v vl/lom-canonical-compliance/test_canonical_chain.py
      - name: LOM 6.x exact-SHA functional regression
        run: python vl/lom-final-hardening/run_level6_exact_main.py
