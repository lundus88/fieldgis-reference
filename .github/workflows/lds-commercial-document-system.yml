name: LUNDUS DIGITAL SYSTEMS Commercial Document System

on:
  pull_request:
    paths:
      - 'docs/commercial/lds-commercial-document-system/**'
      - '.github/workflows/lds-commercial-document-system.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commercial/lds-commercial-document-system/**'
      - '.github/workflows/lds-commercial-document-system.yml'

permissions:
  contents: read

jobs:
  commercial-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate commercial document system
        run: python3 docs/commercial/lds-commercial-document-system/check_documents.py
