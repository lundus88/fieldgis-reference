name: VL Governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'supabase/**'
      - '**/*.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'supabase/**'
      - '**/*.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate critical release governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          errors=[]
          def read(path):
              p=Path(path)
              if not p.exists():
                  errors.append(f'missing critical workflow: {path}')
                  return ''
              return p.read_text()

          runner=read('.github/workflows/vl-factory-runner.yml')
          promoter=read('.github/workflows/vl-production-promoter.yml')
          rollback=read('.github/workflows/vl-production-rollback.yml')
          reconcile=read('.github/workflows/vl-artifact-reconcile.yml')

          checks=[
              ('factory artifact retention must be 90 days', 'retention-days: 90' in runner),
              ('factory runner must use upload-artifact v4', 'actions/upload-artifact@v4' in runner),
              ('factory runner must use OIDC', 'audience=vrs-factory-runner' in runner),
              ('production promoter must use OIDC', 'audience=vrs-production-promoter' in promoter),
              ('production promoter must download immutable artifact', 'actions/download-artifact@v4' in promoter),
              ('production promoter must verify SHA-256', 'sha256sum' in promoter and 'expected_sha256' in promoter),
              ('production rollback must use OIDC', 'audience=vrs-production-rollback' in rollback),
              ('production rollback must download previous immutable artifact', 'actions/download-artifact@v4' in rollback),
              ('production rollback must verify SHA-256', 'sha256sum' in rollback and 'expected_sha256' in rollback),
              ('artifact reconciliation must exist', bool(reconcile)),
              ('artifact reconciliation must use OIDC', 'id-token: write' in reconcile),
          ]
          for label, ok in checks:
              if not ok: errors.append(label)

          critical={
              'factory runner': runner,
              'production promoter': promoter,
              'production rollback': rollback,
              'artifact reconcile': reconcile,
          }
          for name,text in critical.items():
              if re.search(r'(?m)^\s*contents:\s*write\s*$', text):
                  errors.append(f'{name} must not have contents: write')
              if 'pull_request_target:' in text:
                  errors.append(f'{name} must not use pull_request_target')

          if errors:
              print('VL GOVERNANCE CI: FAIL')
              for e in errors: print(f'- {e}')
              sys.exit(1)
          print('VL GOVERNANCE CI: PASS')
          PY
