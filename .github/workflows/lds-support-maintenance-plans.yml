name: LUNDUS DIGITAL SYSTEMS Support Maintenance Plans
on:
  pull_request:
    paths:
      - 'docs/commercial/lds-support-maintenance-plans/**'
      - '.github/workflows/lds-support-maintenance-plans.yml'
permissions:
  contents: read
jobs:
  support-plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python3 docs/commercial/lds-support-maintenance-plans/check_support_plans.py
      - working-directory: docs/commercial/lds-support-maintenance-plans
        run: python3 -m unittest -v test_support_plan_engine.py
