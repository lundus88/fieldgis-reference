<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VL Production Approval Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1020; color:#e8eefc; }
    .card { width:min(92vw,620px); background:#11182c; border:1px solid #26314f; border-radius:18px; padding:24px; box-shadow:0 20px 70px #0008; }
    h1 { margin:0 0 8px; font-size:1.35rem; }
    p { color:#aeb9d4; line-height:1.5; }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input, textarea, button { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #33415f; background:#0d1425; color:#fff; padding:12px; font:inherit; }
    textarea { min-height:90px; resize:vertical; }
    button { margin-top:14px; cursor:pointer; background:#1769e0; border-color:#1769e0; font-weight:700; }
    button.danger { background:#a82626; border-color:#a82626; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .meta { margin-top:18px; padding:12px; border-radius:10px; background:#0d1425; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.84rem; overflow-wrap:anywhere; }
    .ok { color:#72e6a6; } .bad { color:#ff8f8f; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>VL Production Approval Console</h1>
    <p>Human approval only. This page uses your Supabase user session and never contains a service-role key.</p>

    <section id="loginPanel">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="loginBtn">Sign in</button>
    </section>

    <section id="approvalPanel" class="hidden">
      <div class="meta">
        Deployment: <strong id="deploymentId">6a5f15f6-19af-471b-91ad-6dc2ff7a3a63</strong><br>
        Target: <strong>vl-api-production</strong><br>
        Purpose: <strong>controlled rollback-rehearsal canary</strong>
      </div>
      <label for="rationale">Approval rationale</label>
      <textarea id="rationale">Explicit human approval for controlled production canary and rollback rehearsal.</textarea>
      <button id="approveBtn" class="danger">Approve Production Release</button>
      <button id="logoutBtn">Sign out</button>
    </section>

    <div id="status" class="meta">Not signed in.</div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://wczelfmnqpgzfdszxubl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_lWy0g5rcNuhg52xpI9w7Og_2bGXLiOR';
    const DEPLOYMENT_ID = '6a5f15f6-19af-471b-91ad-6dc2ff7a3a63';
    const APPROVAL_URL = `${SUPABASE_URL}/functions/v1/vrs-production-approval`;

    const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    const $ = (id) => document.getElementById(id);
    const setStatus = (msg, ok=false) => {
      $('status').textContent = msg;
      $('status').className = `meta ${ok ? 'ok' : ''}`;
    };

    async function renderSession() {
      const { data: { session } } = await sb.auth.getSession();
      const signedIn = Boolean(session?.access_token);
      $('loginPanel').classList.toggle('hidden', signedIn);
      $('approvalPanel').classList.toggle('hidden', !signedIn);
      setStatus(signedIn ? `Signed in as ${session.user.email}. Awaiting explicit approval.` : 'Not signed in.', signedIn);
    }

    $('loginBtn').addEventListener('click', async () => {
      $('loginBtn').disabled = true;
      setStatus('Signing in...');
      const { error } = await sb.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value,
      });
      $('loginBtn').disabled = false;
      if (error) return setStatus(`Sign-in failed: ${error.message}`);
      await renderSession();
    });

    $('approveBtn').addEventListener('click', async () => {
      if (!confirm(`Approve production deployment ${DEPLOYMENT_ID}?`)) return;
      $('approveBtn').disabled = true;
      setStatus('Submitting authenticated human approval...');
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (!session?.access_token) throw new Error('No authenticated session');
        const response = await fetch(APPROVAL_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${session.access_token}`,
            'Content-Type': 'application/json',
            'apikey': SUPABASE_PUBLISHABLE_KEY,
          },
          body: JSON.stringify({
            deployment_id: DEPLOYMENT_ID,
            rationale: $('rationale').value.trim(),
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(JSON.stringify(payload));
        setStatus(`APPROVED: ${JSON.stringify(payload)}`, true);
      } catch (error) {
        setStatus(`Approval failed: ${error.message || error}`);
      } finally {
        $('approveBtn').disabled = false;
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      await renderSession();
    });

    await renderSession();
  </script>
</body>
</html>
