<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VL Prepare Release 2</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#e8eefc}.card{width:min(92vw,620px);background:#11182c;border:1px solid #26314f;border-radius:18px;padding:24px;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:1.35rem}p{color:#aeb9d4;line-height:1.5}label{display:block;margin:14px 0 6px;font-weight:600}input,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #33415f;background:#0d1425;color:#fff;padding:12px;font:inherit}button{margin-top:14px;cursor:pointer;background:#1769e0;border-color:#1769e0;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.meta{margin-top:18px;padding:12px;border-radius:10px;background:#0d1425;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem;overflow-wrap:anywhere}.ok{color:#72e6a6}.hidden{display:none}</style>
</head>
<body>
<main class="card">
<h1>VL Prepare Release 2</h1>
<p>Staging only. This action compiles the approved App Spec, runs preflight, and creates a new staging factory run. It cannot target production.</p>
<section id="loginPanel">
<label for="email">Email</label><input id="email" type="email" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">Sign in</button>
</section>
<section id="prepPanel" class="hidden">
<div class="meta">App Spec: <b>b159e2b2-b9a0-4271-a5db-8f25fd446a48</b><br>Target: <b>staging</b><br>Production touched: <b>NO</b></div>
<button id="prepBtn">Prepare Release 2 (Staging)</button>
<button id="logoutBtn">Sign out</button>
</section>
<div id="status" class="meta">Not signed in.</div>
</main>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const U='https://wczelfmnqpgzfdszxubl.supabase.co',K='sb_publishable_lWy0g5rcNuhg52xpI9w7Og_2bGXLiOR',PREP=U+'/functions/v1/vrs-release-prep';
const sb=createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);
function setStatus(msg,ok=false){$('status').textContent=msg;$('status').className='meta '+(ok?'ok':'')}
async function render(){const{data:{session}}=await sb.auth.getSession(),on=!!session?.access_token;$('loginPanel').classList.toggle('hidden',on);$('prepPanel').classList.toggle('hidden',!on);setStatus(on?'Signed in as '+session.user.email+'. Ready to create staging release 2.':'Not signed in.',on)}
$('loginBtn').onclick=async()=>{$('loginBtn').disabled=true;setStatus('Signing in...');const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error)return setStatus('Sign-in failed: '+error.message);await render()};
$('prepBtn').onclick=async()=>{if(!confirm('Create Release 2 as a STAGING factory run only?'))return;$('prepBtn').disabled=true;setStatus('Preparing staging release 2...');try{const{data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw new Error('No authenticated session');const r=await fetch(PREP,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':K,'Content-Type':'application/json'},body:'{}'});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(JSON.stringify(p));const id=p?.plan?.factory_run_id||'unknown';setStatus('STAGING RELEASE 2 CREATED. Factory run: '+id,true)}catch(e){setStatus('Release prep failed: '+(e.message||e))}finally{$('prepBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();await render()};await render();
</script>
</body>
</html>
