<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>VL Password Recovery</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1020; color:#e8eefc; padding:20px; }
    .card { width:min(92vw,620px); background:#11182c; border:1px solid #26314f; border-radius:18px; padding:24px; box-shadow:0 20px 70px #0008; }
    h1 { margin:0 0 8px; font-size:1.4rem; }
    p { color:#aeb9d4; line-height:1.5; }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input,button { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #33415f; background:#0d1425; color:#fff; padding:12px; font:inherit; }
    button { margin-top:14px; cursor:pointer; background:#1769e0; border-color:#1769e0; font-weight:700; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .meta { margin-top:18px; padding:12px; border-radius:10px; background:#0d1425; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.84rem; overflow-wrap:anywhere; white-space:pre-wrap; }
    .ok { color:#72e6a6; } .bad { color:#ff8f8f; } .warn { color:#ffd27a; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>VL Password Recovery</h1>
    <p>This page only handles a Supabase password-recovery session. It cannot approve, deploy, promote, finalize health, or mutate Production lifecycle state.</p>

    <section id="resetPanel" class="hidden">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" />
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" />
      <button id="resetBtn">Set new password</button>
    </section>

    <div id="status" class="meta">Checking recovery session...</div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://wczelfmnqpgzfdszxubl.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_lWy0g5rcNuhg52xpI9w7Og_2bGXLiOR';

    const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true }
    });

    const $ = id => document.getElementById(id);

    function setStatus(message, type='') {
      $('status').textContent = message;
      $('status').className = 'meta ' + type;
    }

    async function activateRecoverySession() {
      const url = new URL(window.location.href);
      const queryCode = url.searchParams.get('code');

      if (queryCode) {
        const { error } = await sb.auth.exchangeCodeForSession(queryCode);
        if (error) throw error;
      }

      const { data: { session }, error } = await sb.auth.getSession();
      if (error) throw error;

      if (!session?.access_token) {
        const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const err = hash.get('error_description') || hash.get('error');
        if (err) throw new Error(err);
        throw new Error('No valid password-recovery session. Request a fresh recovery email.');
      }

      $('resetPanel').classList.remove('hidden');
      setStatus('Recovery session verified. Enter a new password.', 'ok');
    }

    $('resetBtn').addEventListener('click', async () => {
      const password = $('password').value;
      const confirm = $('confirmPassword').value;

      if (password.length < 12) {
        return setStatus('Use at least 12 characters for the new password.', 'bad');
      }
      if (password !== confirm) {
        return setStatus('Passwords do not match.', 'bad');
      }

      $('resetBtn').disabled = true;
      setStatus('Updating password...');
      try {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;
        $('password').value = '';
        $('confirmPassword').value = '';
        setStatus('SUCCESS: password updated. You may close this page and sign in with the new password.', 'ok');
        await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      } catch (error) {
        setStatus('Password update failed: ' + (error.message || error), 'bad');
      } finally {
        $('resetBtn').disabled = false;
      }
    });

    await activateRecoverySession().catch(error => {
      $('resetPanel').classList.add('hidden');
      setStatus('Recovery link invalid or expired: ' + (error.message || error), 'bad');
    });
  </script>
</body>
</html>
