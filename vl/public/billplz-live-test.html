<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VL Billplz Live Test</title><style>body{font-family:system-ui;margin:0;background:#0b1220;color:#e8eef8}main{max-width:720px;margin:auto;padding:32px 18px}.card{background:#121c2f;border:1px solid #263651;border-radius:16px;padding:22px;margin:16px 0}input,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #354866}button{font-weight:700;cursor:pointer}.ok{color:#8ce99a}.err{color:#ff8787}.warn{color:#ffd43b}.muted{color:#9fb0c7;font-size:14px}</style></head><body><main><h1>VL Billplz Production Test</h1><div class="card"><p><b>Controlled live payment test: RM1.00 only.</b></p><p class="muted">Creating a bill does not move money. Payment only occurs if you open the Billplz checkout and complete it yourself.</p></div><div class="card"><h2>Sign in</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Name"><button onclick="signin()">Sign In</button><div id="authmsg" class="muted"></div></div><div class="card"><h2>Create RM1.00 Bill</h2><button onclick="createBill()">Create Controlled Billplz Test</button><div id="billmsg" class="muted"></div><p><a id="checkout" href="#" target="_blank" style="display:none;color:#8ce99a">Open Billplz Checkout RM1.00</a></p></div><script>var U='https://wczelfmnqpgzfdszxubl.supabase.co',K='sb_publishable_lWy0g5rcNuhg52xpI9w7Og_2bGXLiOR',S=null;function H(t){var h={'apikey':K,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return h}function msg(id,t,c){var e=document.getElementById(id);e.className=c||'muted';e.textContent=t}async function signin(){try{var r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:H(),body:JSON.stringify({email:email.value.trim(),password:password.value})});var d=await r.json();if(!r.ok)throw new Error(d.message||d.error_description||'Sign in failed');S=d;msg('authmsg','Signed in.','ok')}catch(e){msg('authmsg',e.message,'err')}}async function createBill(){if(!S||!S.access_token){msg('billmsg','Sign in first.','err');return}try{msg('billmsg','Creating Billplz production test bill…','warn');var r=await fetch(U+'/functions/v1/vl-billplz-create-production-test',{method:'POST',headers:H(S.access_token),body:JSON.stringify({email:email.value.trim(),name:name.value.trim()||'VL Owner'})});var d=await r.json();if(!r.ok)throw new Error(d.error||JSON.stringify(d));if(d.amount_minor!==100||d.currency!=='MYR')throw new Error('Amount invariant failed');msg('billmsg','Bill created. No payment has been made yet.','ok');checkout.href=d.checkout_url;checkout.style.display='inline'}catch(e){msg('billmsg',e.message,'err')}}</script></main></body></html>
